  <style>

      naruto:[[['Naruto Uzumaki','Sasuke Uchiha'],10,'Schicksalsrivalen'],[['Naruto Uzumaki','Sasuke Uchiha','Sakura Haruno'],8,'Team 7'],[['Itachi Uchiha','Sasuke Uchiha'],7,'Uchiha-Brüder'],[['Madara Uchiha','Obito Uchiha'],8,'Uchiha-Allianz'],[['Might Guy','Rock Lee'],6,'Jugendliche Kraft'],[['Pain','Konan'],6,'Akatsuki-Partner']],
      onepiece:[[['Monkey D. Luffy','Roronoa Zoro'],7,'Kapitän & Schwert'],[['Monkey D. Luffy','Roronoa Zoro','Sanji'],9,'Monster-Trio'],[['Gol D. Roger','Whitebeard'],7,'Piratenlegenden'],[['Ace','Sabo'],8,'Brüder']],
      jjk:[[['Satoru Gojo','Yuji Itadori'],7,'Mentor & Schüler'],[['Yuji Itadori','Megumi Fushiguro','Nobara Kugisaki'],9,'Tokyo-Trio'],[['Yuta Okkotsu','Rika'],11,'Verfluchte Liebe'],[['Toji Fushiguro','Megumi Fushiguro'],5,'Fushiguro-Familie']],
      dragonball:[[['Son Goku','Vegeta'],8,'Rivalen'],[['Son Goku','Vegeta','Gogeta'],7,'Saiyajin-Fusion'],[['Son Goku','Gohan'],6,'Vater & Sohn'],[['Android 17','Android 18'],7,'Androiden-Duo']]

    const app=document.getElementById('app');
    const resetTop=document.getElementById('resetTop');
    let state=loadSave();
    let setup={universe:'naruto',names:['Spieler A','Spieler B']};
    let draftAmount=0;
    const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const money=n=>`${n} €`;
    const shuffle=arr=>{const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
    const charOf=id=>{const [n,p,role,color,symbol,faction]=catalog[state.universe].entries[id];return {id,name:n,power:p,role,color,symbol,faction};};
    const teamTotal=i=>state.teams[i].reduce((n,id)=>n+charOf(id).power,0);
    const eligibility=i=>state.teams[i].length<TEAM_SIZE && state.money[i]>0;
    const full=i=>state.teams[i].length>=TEAM_SIZE;
    function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(state))}catch(e){}}
    function loadSave(){try{const s=JSON.parse(localStorage.getItem(SAVE_KEY));if(!s||!catalog[s.universe]||!Array.isArray(s.order)||s.order.length!==TOTAL||!Array.isArray(s.teams)||s.teams.length!==2||!Array.isArray(s.money)||s.money.length!==2||!Array.isArray(s.names)||s.names.length!==2||typeof s.round!=='number'||s.round<0||s.round>TOTAL||!['auction','handoff','reveal','final'].includes(s.phase))return null;return s;}catch(e){return null}}
    function clearSave(){try{localStorage.removeItem(SAVE_KEY)}catch(e){}}
    function newGame(sameSet=false){
      gameSound('reveal');
      const universe=sameSet && state?state.universe:setup.universe;
      const names=sameSet && state?state.names:[setup.names[0].trim().slice(0,16)||'Spieler A',setup.names[1].trim().slice(0,16)||'Spieler B'];
      const order=sameSet && state?[...state.order]:shuffle(catalog[universe].entries.map((_,i)=>i)).slice(0,TOTAL);
      state={universe,names,order,round:0,teams:[[],[]],money:[BUDGET,BUDGET],bids:[null,null],turn:0,phase:'auction',last:null,history:[],tieNext:0,automatic:[]};
      draftAmount=0;save();prepareRound();render();
    }
    function chooseAutoRecipient(){
      if(full(0))return 1;
      if(full(1))return 0;
      if(state.teams[0].length!==state.teams[1].length)return state.teams[0].length<state.teams[1].length?0:1;
      const winner=state.tieNext;state.tieNext=1-state.tieNext;return winner;
    }
    function giveCharacter(winner,price,reason,bids){
      const id=state.order[state.round],round=state.round+1;
      if(full(winner))throw Error('Roster is full');
      if(price>state.money[winner])throw Error('Bid exceeds budget');
      state.teams[winner].push(id);state.money[winner]-=price;
      const event={round,id,winner,price,reason,bids:[...bids]};state.history.push(event);
      state.round++;
      return event;
    }
    function prepareRound(){
      // If a team already owns 5 characters, all others belong to the other team for free.
      if(state.round===TOTAL){state.phase='final';save();return}
      if(full(0)||full(1)){
        state.automatic=[];
        while(state.round<TOTAL){const w=chooseAutoRecipient();state.automatic.push(giveCharacter(w,0,'Restverteilung',[0,0]));}
        state.phase='final';save();gameSound('victory');return;
      }
      // Both budgets exhausted: distribute all remaining characters without a further auction.
      if(!eligibility(0)&&!eligibility(1)){
        state.automatic=[];
        while(state.round<TOTAL){const w=chooseAutoRecipient();state.automatic.push(giveCharacter(w,0,'Ohne Budget zugeteilt',[0,0]));}
        state.phase='final';save();gameSound('victory');return;
      }
      state.phase='auction';state.bids=[null,null];state.turn=eligibility(0)?0:1;
      if(!eligibility(0))state.bids[0]=0;
      if(!eligibility(1))state.bids[1]=0;
      draftAmount=0;save();
    }
    function placeBid(amount){
      if(!state||state.phase!=='auction')return;
      const i=state.turn;
      if(!eligibility(i))return;
      if(!Number.isInteger(amount)||amount<0||amount>state.money[i])return;
      state.bids[i]=amount;gameSound('bid');
      const other=1-i;
      if(state.bids[other]===null){state.turn=other;state.phase='handoff';}
      else resolveAuction();
      save();render();
    }
    function resolveAuction(){
      const [a,b]=state.bids;
      if(a===null||b===null)throw Error('Missing bid');
      let winner,reason;
      if(full(0)){winner=1;reason='Freier Teamplatz'}
      else if(full(1)){winner=0;reason='Freier Teamplatz'}
      else if(a>b){winner=0;reason='Höchstes Gebot'}
      else if(b>a){winner=1;reason='Höchstes Gebot'}
      else {winner=chooseAutoRecipient();reason=a===0?'Beide passen – Gratiszuteilung':'Gleichstand – Teamregel';}
      state.last=giveCharacter(winner,state.bids[winner],reason,[a,b]);
      state.phase='reveal';gameSound('reveal');
    }
    function afterReveal(){
      if(!state||state.phase!=='reveal')return;
      prepareRound();save();render();window.scrollTo({top:0,behavior:'smooth'});
    }
    function startNew(){if(!state)return;const ok=confirm('Aktuelles Spiel wirklich beenden und zur Startseite wechseln?');if(!ok)return;clearSave();state=null;render();}
    function portrait(name,cssClass='portrait',important=false){

    function teamPanel(i){
      const team=state.teams[i],empty=TEAM_SIZE-team.length;
      const rows=team.map(id=>{const c=charOf(id);return `<div class="roster-item"><div class="roster-avatar" style="--ac:${c.color}">${portrait(c.name,'roster-photo')}</div><div class="roster-info"><strong>${safe(c.name)}</strong><small>${safe(c.role)}</small></div><span class="roster-power">${c.power}<small> PWR</small></span></div>`}).join('')+Array.from({length:empty},(_,j)=>`<div class="roster-item empty"><span class="slot-index">0${team.length+j+1}</span><span class="slot-description">LEERER SLOT</span><span class="slot-plus">+</span></div>`).join('');
      return `<section class="team-panel team-${i?'b':'a'}" aria-label="Team ${i?'B':'A'}"><div class="team-brandline"><span class="team-kicker">● TEAM ${i?'B':'A'}</span><span class="team-count">${team.length} / 5 KARTEN</span></div><h2 class="team-name">${safe(state.names[i])}</h2><div class="budget"><div><span class="budget-label">VERFÜGBARES BUDGET</span><span class="budget-bar"><i style="width:${state.money[i]/BUDGET*100}%"></i></span></div><strong class="budget-value">${money(state.money[i])}</strong></div><div class="roster-header">DEIN KADER <span>${team.length}/5</span></div><div class="team-roster">${rows}</div></section>`;
    }
    function characterCard(){
      const onReveal=state.phase==='reveal',shownIndex=onReveal?state.last.round:state.round+1,c=charOf(onReveal?state.last.id:state.order[state.round]);
      const rarity=c.power>=97?'MYTHISCH':c.power>=92?'LEGENDÄR':c.power>=86?'EPISCH':'RARE';
      return `<div class="stage-top"><span><i class="live-indicator"></i> LIVE DROP <em>#${String(shownIndex).padStart(2,'0')}</em></span><span class="rarity">✦ ${rarity}</span></div>
      <div class="character-stage" style="--light:${c.color};--shade:${c.color}66">
        <div class="stage-beam"></div><div class="stage-orbit"></div>${portrait(c.name,'stage-portrait',true)}
        <div class="stage-sticker">NEW<br>DROP!</div>
        <div class="card-copy"><span class="character-index">◈ ${safe(c.faction)} · ${String(shownIndex).padStart(2,'0')} / ${TOTAL}</span><h2>${safe(c.name)}</h2><span class="character-description">${safe(c.role)}</span></div>
      </div>
      <div class="character-stats"><div class="stat"><span>POWER LEVEL</span><b class="highlight">${c.power} <small>/ 100</small></b></div><div class="stat"><span>FRAKTION</span><b style="font-size:17px">${safe(c.faction)}</b></div></div>`;
    }
    function bidStage(){
      if(state.phase==='handoff'){
        const i=state.turn;
        return `<div class="handoff fade-in"><div class="handoff-icon">🔒</div><div class="eyebrow">GEBOT GESPEICHERT</div><h2>GEHEIME<br>ÜBERGABE</h2><p>Gib dein Gerät an <strong>${safe(state.names[i])}</strong> weiter. Das vorherige Gebot bleibt versteckt.</p><button id="revealBidding" class="primary" type="button">ICH BIN ${safe(state.names[i])} <span>→</span></button></div>`;
      }
      if(state.phase==='reveal'){
        const e=state.last,c=charOf(e.id),free=e.price===0;
        return `<div class="reveal fade-in"><div class="reveal-emblem">${free?'🎁':'🏆'}</div><div class="eyebrow" style="color:#ffd19b">${safe(c.name)} GEHT AN</div><h2>${safe(state.names[e.winner])}<span>!</span></h2><p>${safe(e.reason)} · ${free?'GRATIS':money(e.price)+' BEZAHLT'}</p><div class="bid-compare"><div class="compare-tile">TEAM A · ${safe(state.names[0])}<b>${money(e.bids[0])}</b></div><div class="compare-tile">TEAM B · ${safe(state.names[1])}<b>${money(e.bids[1])}</b></div></div><button id="nextRound" type="button" class="primary full">${state.round===TOTAL?'ZUM GROSSEN FINALE':'NÄCHSTEN DROP ENTHÜLLEN'} <span>→</span></button></div>`;
      }
      const i=state.turn,p=state.names[i],cash=state.money[i];
      return `<div class="bid-zone fade-in"><div class="bid-heading"><span class="bid-title">SETZE DEIN GEBOT</span><span class="bid-side">TEAM ${i?'B':'A'} · ${safe(p)}</span></div>
      <p class="bid-turn">Wie viel ist dir dieser Kämpfer wert? <strong>Dein Gebot ist geheim.</strong></p>
      <div class="bid-meter"><div><div class="bid-meter-label">DEIN ANGEBOT</div><strong id="bidAmount" class="bid-amount">${draftAmount}</strong><span class="bid-euro">€</span></div><div class="bid-remaining">BUDGET<br><strong>${money(cash)}</strong></div></div>
      <input aria-label="Gebot in Euro" id="bidSlider" class="bid-slider" type="range" min="0" max="${cash}" step="1" value="${draftAmount}" />
      <div class="quick-bids"><button type="button" data-quick="0">PASS</button><button type="button" data-quick="3" ${cash<3?'disabled':''}>3 €</button><button type="button" data-quick="5" ${cash<5?'disabled':''}>5 €</button><button type="button" data-quick="10" ${cash<10?'disabled':''}>10 €</button><button type="button" data-quick="max">ALL IN</button></div>
      <button id="submitBid" class="primary full" type="button">🔒 GEBOT ABGEBEN <span>→</span></button>
      <p class="bid-notice">Der nächste Charakter bleibt geheim. Strategisch bieten!</p></div>`;
    }
    function getSynergies(ids){const names=ids.map(id=>charOf(id).name);return (synergyRules[state.universe]||[]).filter(([members])=>members.every(n=>names.includes(n))).map(([_,bonus,label])=>({bonus,label}));}
    function calcScore(i){const power=teamTotal(i),synergies=getSynergies(state.teams[i]);return {power,synergies,score:power+synergies.reduce((s,b)=>s+b.bonus,0)};}
    function finalPanel(i){const d=calcScore(i);const team=state.teams[i];return `<section class="final-panel ${i?'b':'a'}"><div class="team-kicker">● TEAM ${i?'B':'A'}</div><div class="final-name">${safe(state.names[i])}</div><div class="final-score">${d.score}<span> PTS</span></div><div class="score-label">TEAM POWER</div><div class="result-roster">${team.map(id=>{const c=charOf(id);return `<div class="result-row">${portrait(c.name,'final-photo')}<span>${safe(c.name)}</span><strong>${c.power}</strong></div>`}).join('')}</div><div class="synergy-section">BASISPOWER: <b>${d.power}</b>${d.synergies.length?d.synergies.map(e=>`<span class="synergy-chip">✦ ${safe(e.label)} +${e.bonus}</span>`).join(''):'<span class="synergy-chip">Keine Team-Synergien</span>'}</div><div class="score-total"><span>REST: ${money(state.money[i])}</span><b>${d.score} PUNKTE</b></div></section>`;}
    function historyPanel(){return `<details class="history-panel"><summary>Auktionsverlauf ansehen (${state.history.length} Runden)</summary><div>${state.history.map(e=>`<div class="history-entry"><span>#${e.round} <strong>${safe(charOf(e.id).name)}</strong></span><span>${safe(state.names[e.winner])} · ${money(e.price)}${e.reason.startsWith('Rest')?' (Rest)':''}</span></div>`).join('')}</div></details>`;}
    function renderFinal(){const a=calcScore(0),b=calcScore(1),w=a.score===b.score?-1:a.score>b.score?0:1,auto=state.automatic||[];return `<div class="fade-in result-screen"><div class="end-header"><div class="eyebrow">🏆 GRAND FINALE · ${safe(catalog[state.universe].name).toUpperCase()}</div><h1>FINAL <span>SHOWDOWN</span></h1><p>10 Charaktere · 2 Kader · 1 Champion</p></div>
      <div class="winner-card"><div class="confetti-sparks" aria-hidden="true">${Array.from({length:18},(_,i)=>`<i style="--i:${i}"></i>`).join('')}</div><div class="trophy">${w<0?'⚔':'🏆'}</div><div class="winner-tag">${w<0?'UNENTSCHIEDEN':'THE CHAMPION'}</div><div class="winner-name">${w<0?'GLEICHSTAND':safe(state.names[w])}</div><div class="winner-note">${w<0?'Beide Teams haben dieselbe Power!':`+${Math.abs(a.score-b.score)} PUNKTE VORSPRUNG · TEAM ${w?'B':'A'} GEWINNT!`}</div></div>
      <div class="final-grid">${finalPanel(0)}${finalPanel(1)}</div>
      ${auto.length?`<div class="legend" style="max-width:880px;margin:20px auto"><strong>🎁 AUTO-DRAFT:</strong> ${auto.map(e=>`${safe(charOf(e.id).name)} → ${safe(state.names[e.winner])}`).join(' · ')}</div>`:''}
      <div class="final-actions"><button id="rematch" type="button" class="primary">⚡ NEUES DUELL</button><button id="sameSet" type="button" class="secondary">↺ SELBE KARTEN</button><button id="home" type="button" class="secondary">THEMA WECHSELN</button></div>${historyPanel()}
      <p class="toastline">Fangame · Stärkepunkte und Synergien sind spielerische Einschätzungen.</p></div>`;}
    function renderGame(){
      if(state.phase==='final')return renderFinal();
      return `<div class="fade-in arena-screen"><div class="gamehead"><div><div class="eyebrow">${safe(catalog[state.universe].name).toUpperCase()} <span class="arena-separator">/</span> LIVE AUCTION</div><h1>ROUND <span class="round-now">${String(state.phase==='reveal'?state.round:state.round+1).padStart(2,'0')}</span> <span class="round-total">/ ${TOTAL}</span></h1></div><div class="arena-status"><span class="live-indicator"></span> AUKTION LÄUFT</div></div>
      <div class="round-tracker" aria-label="Rundenfortschritt">${Array.from({length:TOTAL},(_,i)=>`<div class="round-dot ${i<state.round?'past':i===state.round?'current':''}"></div>`).join('')}</div>
      <div class="game-grid">${teamPanel(0)}<div class="center-content"><section class="auction-panel">${state.phase==='handoff'?'':characterCard()}${bidStage()}</section></div>${teamPanel(1)}</div>
      <div class="legend"><strong>SPIELREGEL:</strong> Beide Spieler starten mit 20 €. Jedes höchste geheime Gebot gewinnt die aktuelle Karte. Die nächsten Drops bleiben unbekannt. Bei 0 € oder 5 Karten wird ausgesetzt; verbleibende Karten werden automatisch verteilt.</div><div class="legend-inline"><span>⚡ 10 RANDOM DROPS</span><span>◈ 5 PRO TEAM</span><span>🔒 SECRET BIDS</span></div></div>`;
    }
    function renderSetup(){
      const faces={naruto:'Naruto Uzumaki',onepiece:'Monkey D. Luffy',jjk:'Satoru Gojo',dragonball:'Son Goku'};
      const opts=Object.entries(catalog).map(([key,u])=>`<button class="universe ${setup.universe===key?'active':''}" data-universe="${key}" aria-pressed="${setup.universe===key}" type="button"><div class="uni-background">${portrait(faces[key],'uni-photo')}</div><span class="uni-check">✓</span><span class="uni-details"><b>${safe(u.name)}</b><small>${key==='naruto'?'SHINOBI':'onepiece'===key?'PIRATES':key==='jjk'?'SORCERERS':'SAIYANS'}</small></span></button>`).join('');
      return `<div class="hero fade-in"><section class="hero-left"><div class="hero-pretitle"><span class="blinking-dot"></span> THE ULTIMATE ANIME AUCTION GAME</div><h1>BUILD YOUR<br><em>DREAM</em><br>TEAM<span class="hero-stop">.</span></h1><p>10 zufällige Anime-Charaktere. Nur <strong>20 € Budget</strong>. Du weißt nie, wer als Nächstes kommt. Biete klug, sammle deine Legenden und besiege deinen Rivalen.</p><div class="hero-badges"><span>⚔ 1 VS 1</span><span>💰 20 €</span><span>🎴 10 DROPS</span><span>🏆 1 SIEGER</span></div>
      <div class="hero-showcase" aria-hidden="true"><div class="hero-shine"></div><div class="showcase-card showcase-left"><div class="showcase-rank">SS TIER</div>${portrait('Satoru Gojo','showcase-photo')}<div class="showcase-caption">GOJO <b>100</b></div></div><div class="showcase-card showcase-right"><div class="showcase-rank">MYTHIC</div>${portrait('Naruto Uzumaki','showcase-photo')}<div class="showcase-caption">NARUTO <b>98</b></div></div><div class="showcase-vs">VS</div></div>
      </section><section class="set-card"><div class="set-header"><span class="set-icon">⚡</span><div><div class="section-label">PLAYER SETUP</div><h2>READY TO <span>BATTLE?</span></h2><p>Wähle dein Universum und stelle dich dem Duell.</p></div></div>
      <div class="section-label">01 <span class="section-line"></span> WÄHLE DEIN UNIVERSUM</div><div class="universes">${opts}</div>
      <div class="section-label">02 <span class="section-line"></span> SPIELERNAMEN</div><div class="names"><div class="field"><label for="playerA"><span class="player-indicator"></span> TEAM A</label><input class="name-input" id="playerA" maxlength="16" value="${safe(setup.names[0])}" autocomplete="off" placeholder="Spieler A"></div><div class="field"><label for="playerB"><span class="player-indicator p2"></span> TEAM B</label><input class="name-input" id="playerB" maxlength="16" value="${safe(setup.names[1])}" autocomplete="off" placeholder="Spieler B"></div></div>
      <div class="game-rules-mini"><div><b>20 €</b><span>STARTBUDGET</span></div><div><b>10</b><span>KARTEN</span></div><div><b>5 / 5</b><span>DEIN TEAM</span></div></div>
      <button class="primary full start-cta" id="startGame" type="button">⚡ START THE BATTLE <span>→</span></button><div class="subtext">FREE TO PLAY · 2 SPIELER · EIN GERÄT</div></section></div>`;
    }
    // Image catalog (character portraits from the public Jikan / MyAnimeList anime API).
    // The game has a functional CSS fallback if the external image service is unavailable.
    const ANIME_API_IDS={naruto:1735,onepiece:21,jjk:40748,dragonball:30694};
    const imageBanks={}, imagePromises={};
    const normalized=n=>String(n).normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
    const aliases={
      'Pain':'Nagato', 'Killer B':'Killer Bee', 'Might Guy':'Might Guy',
      'Whitebeard':'Edward Newgate','Blackbeard':'Marshall D Teach','Big Mom':'Charlotte Linlin',
      'Ace':'Portgas D Ace','Garp':'Monkey D Garp','Kizaru':'Borsalino','Akainu':'Sakazuki',
      'Aokiji':'Kuzan','Doflamingo':'Donquixote Doflamingo','Katakuri':'Charlotte Katakuri',
      'Trafalgar Law':'Trafalgar D Water Law','Eustass Kid':'Eustass Kid',
      'Son Goku':'Son Gokuu','Frieza':'Freeza','Majin Boo':'Majin Buu',
      'Android 17':'Jinzouningen 17 gou','Android 18':'Jinzouningen 18 gou',
      'Goku Black':'Black Goku','Master Roshi':'Muten Rouhi',
      'Ryomen Sukuna':'Sukuna Ryomen','Rika':'Orimoto Rika'
    };
    function charImage(name){
      const search=normalized(aliases[name]||name);
      for(const universe of Object.keys(imageBanks)){
        const bank=imageBanks[universe];if(!bank)continue;
        if(bank[search])return bank[search];
        const tokens=search.split(' ').filter(x=>x.length>1);
        const ranked=Object.keys(bank).filter(x=>tokens.every(t=>x.split(' ').includes(t)));
        if(ranked.length===1)return bank[ranked[0]];
      }
      return null;
    }
    function hydratePhotos(){
      document.querySelectorAll('img[data-photo-char]').forEach(img=>{
        const url=charImage(img.dataset.photoChar);
        if(!url || img.dataset.photoUrl===url)return;
        img.dataset.photoUrl=url;img.onerror=()=>{img.classList.remove('loaded');img.classList.add('failed');};
        img.onload=()=>{img.classList.add('loaded');img.classList.remove('failed')};
        img.referrerPolicy='no-referrer';img.src=url;
      });
    }
    function loadAnimePhotos(universe){
      if(imagePromises[universe])return imagePromises[universe];
      const key='bidbattle.imgbank.v2.'+universe;
      try{const data=JSON.parse(localStorage.getItem(key)||'null');if(data&&data.bank&&Date.now()-data.at<30*86400000){imageBanks[universe]=data.bank;hydratePhotos();return imagePromises[universe]=Promise.resolve()}}catch(e){}
      imagePromises[universe]=fetch(`https://api.jikan.moe/v4/anime/${ANIME_API_IDS[universe]}/characters`,{mode:'cors'}).then(r=>{if(!r.ok)throw new Error('Bilder-API: '+r.status);return r.json()}).then(obj=>{
        const bank={};for(const row of (obj.data||[])){
          const ch=row.character,url=ch?.images?.webp?.image_url||ch?.images?.jpg?.image_url;
          if(ch?.name&&url)bank[normalized(ch.name)]=url;
        }
        imageBanks[universe]=bank;
        try{localStorage.setItem(key,JSON.stringify({at:Date.now(),bank}))}catch(e){}
        hydratePhotos();
      }).catch(()=>{});
      return imagePromises[universe];
    }
    function ensureImages(){
      loadAnimePhotos(state?.universe||setup.universe);
      if(!state){
        // Stagger the other universes to respect Jikan's rate limit.
        const keys=Object.keys(ANIME_API_IDS).filter(x=>x!==setup.universe);
        keys.forEach((key,i)=>setTimeout(()=>loadAnimePhotos(key),1100*(i+1)));
      }
    }
    let soundEnabled=false;
    function gameSound(kind='bid'){
      if(!soundEnabled)return;
      try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const ctx=gameSound.ctx||(gameSound.ctx=new C());
        const notes=kind==='victory'?[523,659,784,1046]:kind==='reveal'?[290,490,780]:[470,580];
        notes.forEach((note,i)=>{const o=ctx.createOscillator(),gain=ctx.createGain();o.type='triangle';o.frequency.value=note;
          const t=ctx.currentTime+i*.115;gain.gain.setValueAtTime(.0001,t);gain.gain.exponentialRampToValueAtTime(.06,t+.015);gain.gain.exponentialRampToValueAtTime(.0001,t+.22);
          o.connect(gain);gain.connect(ctx.destination);o.start(t);o.stop(t+.24)});
      }catch(e){}
    }
    function render(){app.innerHTML=state?renderGame():renderSetup();resetTop.hidden=!state;bindEvents();hydratePhotos();}
    document.getElementById('soundToggle').addEventListener('click',e=>{soundEnabled=!soundEnabled;e.currentTarget.textContent=soundEnabled?'♫ An':'♪ Aus';e.currentTarget.title=soundEnabled?'Sound ausschalten':'Sound aktivieren';if(soundEnabled)gameSound()});
    function bindEvents(){
      if(!state){
        app.querySelectorAll('[data-universe]').forEach(btn=>btn.addEventListener('click',()=>{setup.universe=btn.dataset.universe;setup.names=[document.getElementById('playerA').value,document.getElementById('playerB').value];render();loadAnimePhotos(setup.universe)}));
        document.getElementById('playerA').addEventListener('input',e=>setup.names[0]=e.target.value);
        document.getElementById('playerB').addEventListener('input',e=>setup.names[1]=e.target.value);
        document.getElementById('startGame').addEventListener('click',()=>newGame());
        return;
      }
      if(state.phase==='auction'){
        const slider=document.getElementById('bidSlider');slider.addEventListener('input',e=>{draftAmount=Number(e.target.value);document.getElementById('bidAmount').textContent=draftAmount;});
        app.querySelectorAll('[data-quick]').forEach(el=>el.addEventListener('click',()=>{draftAmount=el.dataset.quick==='max'?state.money[state.turn]:Number(el.dataset.quick);slider.value=draftAmount;document.getElementById('bidAmount').textContent=draftAmount;}));
        document.getElementById('submitBid').addEventListener('click',()=>placeBid(draftAmount));
      }
      if(state.phase==='handoff')document.getElementById('revealBidding').addEventListener('click',()=>{state.phase='auction';draftAmount=0;save();render()});
      if(state.phase==='reveal')document.getElementById('nextRound').addEventListener('click',afterReveal);
      if(state.phase==='final'){
        document.getElementById('rematch').addEventListener('click',()=>{setup={universe:state.universe,names:[...state.names]};newGame(false)});
        document.getElementById('sameSet').addEventListener('click',()=>newGame(true));
        document.getElementById('home').addEventListener('click',()=>{setup={universe:state.universe,names:[...state.names]};state=null;clearSave();render();window.scrollTo(0,0)});
      }
    }
    resetTop.addEventListener('click',startNew);
    // Recover gracefully if an old or partially written save is malformed.
    try{if(state){if(state.phase==='auction'&&state.bids[state.turn]!==null){state.phase='handoff';}if(state.round===TOTAL&&state.phase!=='reveal')state.phase='final';}}catch(e){state=null;clearSave();}
    render();ensureImages();
    if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{});}
  </script>
</body>
</html>
