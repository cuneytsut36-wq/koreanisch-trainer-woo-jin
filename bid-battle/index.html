<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand"><span class="logo" aria-hidden="true">⚡</span><span>BID <b>BATTLE</b></span></div>
      <div class="topright"><span class="pill">ANIME AUCTION ARENA</span><button class="tiny-btn" id="resetTop" hidden type="button">↺ Neu starten</button></div>
    </header>
    <div id="app" aria-live="polite"></div>
    <footer class="foot">Fangemachtes Anime-Partyspiel · Bewertungen dienen nur dem Spiel · Keine offizielle Verbindung zu den Anime-Marken</footer>
  </main>
  <script>
    'use strict';
    // Static, offline-friendly app: no accounts, trackers or required external scripts.
    const SAVE_KEY='bidbattle.save.v1';
    const BUDGET=20, TEAM_SIZE=5, TOTAL=10;
    // [Name, playful power, role, color, sign, faction]. Power scores are subjective game balancing.
    const catalog={
      naruto:{name:'Naruto',icon:'🍥',tagline:'Das Shinobi-Duell',entries:[
        ['Naruto Uzumaki',98,'Jinchūriki','#f6a345','九','Konoha'],['Sasuke Uchiha',97,'Uchiha','#8c79d9','雷','Konoha'],['Madara Uchiha',100,'Legende','#bf5266','炎','Uchiha'],['Itachi Uchiha',92,'Genjutsu','#a65080','月','Akatsuki'],['Kakashi Hatake',88,'Kopierninja','#789cbd','雷','Konoha'],['Pain',91,'Rinnegan','#ca765c','神','Akatsuki'],['Minato Namikaze',93,'Gelber Blitz','#edb54c','閃','Konoha'],['Hashirama Senju',97,'Erster Hokage','#6cb38e','木','Konoha'],['Obito Uchiha',95,'Kamui','#9d6cbb','眼','Akatsuki'],['Kaguya Ōtsutsuki',100,'Ōtsutsuki','#c0bbe6','天','Ōtsutsuki'],['Jiraiya',85,'Sannin','#cb7d6b','蛙','Konoha'],['Orochimaru',85,'Sannin','#9590b2','蛇','Otogakure'],['Gaara',83,'Kazekage','#d29d65','砂','Suna'],['Tsunade',83,'Hokage','#8abe7e','医','Konoha'],['Might Guy',94,'Taijutsu','#81c371','拳','Konoha'],['Shikamaru Nara',77,'Stratege','#8f9aa4','影','Konoha'],['Sakura Haruno',85,'Medizinninja','#f28d9d','桜','Konoha'],['Killer B',87,'Jinchūriki','#c1a471','八','Kumo'],['Tobirama Senju',91,'Zweiter Hokage','#67a8bf','水','Konoha'],['Rock Lee',80,'Taijutsu','#6cb870','拳','Konoha'],['Deidara',79,'Explosion','#e8b96c','爆','Akatsuki'],['Kisame Hoshigaki',84,'Schwertkämpfer','#4e9fb1','鮫','Akatsuki'],['Konan',82,'Papierjutsu','#79a4d0','紙','Akatsuki'],['Hiruzen Sarutobi',84,'Dritter Hokage','#bb8560','猿','Konoha']

      ]},
      jjk:{name:'Jujutsu Kaisen',icon:'👁️',tagline:'Der Fluch der Auktion',entries:[
        ['Satoru Gojo',100,'Sechs Augen','#6daed8','∞','Jujutsu'],['Ryomen Sukuna',100,'König der Flüche','#c6576a','呪','Flüche'],['Yuta Okkotsu',96,'Sondergrad','#9d9ecd','愛','Jujutsu'],['Toji Fushiguro',94,'Sorcerer Killer','#61a690','刃','Solo'],['Suguru Geto',93,'Fluchmanipulation','#8d78b8','呪','Flüche'],['Kenjaku',96,'Taktiker','#9472b4','脳','Flüche'],['Yuji Itadori',91,'Nahkampf','#db767e','拳','Jujutsu'],['Megumi Fushiguro',88,'Zehn Schatten','#6e8fb0','影','Jujutsu'],['Nobara Kugisaki',84,'Resonanz','#c18c60','釘','Jujutsu'],['Maki Zenin',93,'Waffenmeisterin','#7baf8a','刀','Jujutsu'],['Toge Inumaki',85,'Fluchsprache','#8e9ac5','言','Jujutsu'],['Panda',81,'Mutierter Kern','#9598a1','熊','Jujutsu'],['Aoi Todo',89,'Boogie Woogie','#ba8d68','拳','Jujutsu'],['Mahito',91,'Seelenwandler','#7897b8','魂','Flüche'],['Jogo',88,'Vulkanfluch','#d9765b','火','Flüche'],['Hanami',85,'Naturfluch','#77aa78','森','Flüche'],['Choso',90,'Bluttechnik','#b66e80','血','Solo'],['Kinji Hakari',93,'Jackpot','#d9a76e','運','Jujutsu'],['Kashimo Hajime',93,'Blitzkraft','#80a6c8','雷','Solo'],['Uraume',89,'Eistechnik','#9dbfcd','氷','Flüche'],['Rika',95,'Fluchkönigin','#b99dbf','愛','Jujutsu'],['Naoya Zenin',88,'Projektion','#8fbc85','速','Zenin'],['Dagon',85,'Ozeanfluch','#7e9dc9','海','Flüche'],['Mei Mei',86,'Krähenkontrolle','#c0ab8b','鳥','Solo']
      ]},
      dragonball:{name:'Dragon Ball',icon:'🐉',tagline:'Das Turnier des Universums',entries:[
        ['Son Goku',100,'Saiyajin','#f59a4e','悟','Saiyajin'],['Vegeta',98,'Saiyajin-Prinz','#6483c7','王','Saiyajin'],['Gohan',96,'Mystischer Kämpfer','#af7cca','飯','Saiyajin'],['Broly',99,'Legendärer Saiyajin','#8abb69','怒','Saiyajin'],['Frieza',97,'Imperator','#ae88d5','帝','Bösewichte'],['Cell',95,'Perfekte Form','#82ba7b','完','Bösewichte'],['Majin Boo',95,'Magischer Kämpfer','#d883aa','魔','Bösewichte'],['Beerus',100,'Zerstörungsgott','#9e73c1','破','Götter'],['Whis',100,'Engel','#76aec7','天','Götter'],['Jiren',99,'Pride Trooper','#bd6571','力','Universum 11'],['Piccolo',93,'Namekianer','#66b379','魔','Erdlinge'],['Trunks',94,'Zeitreisender','#9082d1','剣','Saiyajin'],['Gotenks',92,'Fusion','#ad9b64','合','Saiyajin'],['Android 17',93,'Android','#7ca9b0','17','Androiden'],['Android 18',91,'Androidin','#cfa879','18','Androiden'],['Hit',95,'Assassine','#8179c2','時','Universum 6'],['Kefla',95,'Fusion','#83b871','合','Saiyajin'],['Gogeta',100,'Fusion','#759cd1','合','Saiyajin'],['Vegito',100,'Fusion','#af78b4','合','Saiyajin'],['Goku Black',97,'Göttlicher Gegner','#a66aa4','黒','Bösewichte'],['Zamasu',94,'Gott','#78b38f','神','Bösewichte'],['Master Roshi',78,'Kampfmeister','#e0a76d','亀','Erdlinge'],['Krillin',82,'Kämpfer','#e9ae6b','気','Erdlinge'],['Tien Shinhan',84,'Kampfkünstler','#a5a278','気','Erdlinge']
      ]}
    };
    const synergyRules={
      naruto:[[['Naruto Uzumaki','Sasuke Uchiha'],10,'Schicksalsrivalen'],[['Naruto Uzumaki','Sasuke Uchiha','Sakura Haruno'],8,'Team 7'],[['Itachi Uchiha','Sasuke Uchiha'],7,'Uchiha-Brüder'],[['Madara Uchiha','Obito Uchiha'],8,'Uchiha-Allianz'],[['Might Guy','Rock Lee'],6,'Jugendliche Kraft'],[['Pain','Konan'],6,'Akatsuki-Partner']],
      onepiece:[[['Monkey D. Luffy','Roronoa Zoro'],7,'Kapitän & Schwert'],[['Monkey D. Luffy','Roronoa Zoro','Sanji'],9,'Monster-Trio'],[['Gol D. Roger','Whitebeard'],7,'Piratenlegenden'],[['Ace','Sabo'],8,'Brüder']],
      jjk:[[['Satoru Gojo','Yuji Itadori'],7,'Mentor & Schüler'],[['Yuji Itadori','Megumi Fushiguro','Nobara Kugisaki'],9,'Tokyo-Trio'],[['Yuta Okkotsu','Rika'],11,'Verfluchte Liebe'],[['Toji Fushiguro','Megumi Fushiguro'],5,'Fushiguro-Familie']],
      dragonball:[[['Son Goku','Vegeta'],8,'Rivalen'],[['Son Goku','Vegeta','Gogeta'],7,'Saiyajin-Fusion'],[['Son Goku','Gohan'],6,'Vater & Sohn'],[['Android 17','Android 18'],7,'Androiden-Duo']]
    };

    const app=document.getElementById('app');
    const resetTop=document.getElementById('resetTop');
    let state=loadSave();
    let setup={universe:'naruto',names:['Spieler A','Spieler B']};
    let draftAmount=0;
    const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const money=n=>`${n} €`;
    const shuffle=arr=>{const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
    const charOf=id=>{const [n,p,role,color,symbol,faction]=catalog[state.universe].entries[id];return {id,name:n,power:p,role,color,symbol,faction};};
    const teamTotal=i=>state.teams[i].reduce((n,id)=>n+charOf(id).power,0);
    const eligibility=i=>state.teams[i].length<TEAM_SIZE && state.money[i]>0;
    const full=i=>state.teams[i].length>=TEAM_SIZE;
    function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(state))}catch(e){}}
    function loadSave(){try{const s=JSON.parse(localStorage.getItem(SAVE_KEY));if(!s||!catalog[s.universe]||!Array.isArray(s.order)||s.order.length!==TOTAL||!Array.isArray(s.teams)||s.teams.length!==2||!Array.isArray(s.money)||s.money.length!==2||!Array.isArray(s.names)||s.names.length!==2||typeof s.round!=='number'||s.round<0||s.round>TOTAL||!['auction','handoff','reveal','final'].includes(s.phase))return null;return s;}catch(e){return null}}
    function clearSave(){try{localStorage.removeItem(SAVE_KEY)}catch(e){}}
    function newGame(sameSet=false){
      const universe=sameSet && state?state.universe:setup.universe;
      const names=sameSet && state?state.names:[setup.names[0].trim().slice(0,16)||'Spieler A',setup.names[1].trim().slice(0,16)||'Spieler B'];
      const order=sameSet && state?[...state.order]:shuffle(catalog[universe].entries.map((_,i)=>i)).slice(0,TOTAL);
      state={universe,names,order,round:0,teams:[[],[]],money:[BUDGET,BUDGET],bids:[null,null],turn:0,phase:'auction',last:null,history:[],tieNext:0,automatic:[]};
      draftAmount=0;save();prepareRound();render();
    }
    function chooseAutoRecipient(){
      if(full(0))return 1;
      if(full(1))return 0;
      if(state.teams[0].length!==state.teams[1].length)return state.teams[0].length<state.teams[1].length?0:1;
      const winner=state.tieNext;state.tieNext=1-state.tieNext;return winner;
    }
    function giveCharacter(winner,price,reason,bids){
      const id=state.order[state.round],round=state.round+1;
      if(full(winner))throw Error('Roster is full');
      if(price>state.money[winner])throw Error('Bid exceeds budget');
      state.teams[winner].push(id);state.money[winner]-=price;
      const event={round,id,winner,price,reason,bids:[...bids]};state.history.push(event);
      state.round++;
      return event;
    }
    function prepareRound(){
      // If a team already owns 5 characters, all others belong to the other team for free.
      if(state.round===TOTAL){state.phase='final';save();return}
      if(full(0)||full(1)){
        state.automatic=[];
        while(state.round<TOTAL){const w=chooseAutoRecipient();state.automatic.push(giveCharacter(w,0,'Restverteilung',[0,0]));}
        state.phase='final';save();return;
      }
      // Both budgets exhausted: distribute all remaining characters without a further auction.
      if(!eligibility(0)&&!eligibility(1)){
        state.automatic=[];
        while(state.round<TOTAL){const w=chooseAutoRecipient();state.automatic.push(giveCharacter(w,0,'Ohne Budget zugeteilt',[0,0]));}
        state.phase='final';save();return;
      }
      state.phase='auction';state.bids=[null,null];state.turn=eligibility(0)?0:1;
      if(!eligibility(0))state.bids[0]=0;
      if(!eligibility(1))state.bids[1]=0;
      draftAmount=0;save();
    }
    function placeBid(amount){
      if(!state||state.phase!=='auction')return;
      const i=state.turn;
      if(!eligibility(i))return;
      if(!Number.isInteger(amount)||amount<0||amount>state.money[i])return;
      state.bids[i]=amount;
      const other=1-i;
      if(state.bids[other]===null){state.turn=other;state.phase='handoff';}
      else resolveAuction();
      save();render();
    }
    function resolveAuction(){
      const [a,b]=state.bids;
      if(a===null||b===null)throw Error('Missing bid');
      let winner,reason;
      if(full(0)){winner=1;reason='Freier Teamplatz'}
      else if(full(1)){winner=0;reason='Freier Teamplatz'}
      else if(a>b){winner=0;reason='Höchstes Gebot'}
      else if(b>a){winner=1;reason='Höchstes Gebot'}
      else {winner=chooseAutoRecipient();reason=a===0?'Beide passen – Gratiszuteilung':'Gleichstand – Teamregel';}
      state.last=giveCharacter(winner,state.bids[winner],reason,[a,b]);
      state.phase='reveal';
    }
    function afterReveal(){
      if(!state||state.phase!=='reveal')return;
      prepareRound();save();render();window.scrollTo({top:0,behavior:'smooth'});
    }
    function startNew(){if(!state)return;const ok=confirm('Aktuelles Spiel wirklich beenden und zur Startseite wechseln?');if(!ok)return;clearSave();state=null;render();}
    function teamPanel(i){
      const team=state.teams[i],empty=TEAM_SIZE-team.length;
      const rows=team.map(id=>{const c=charOf(id);return `<div class="roster-item"><div class="roster-avatar" style="--ac:${c.color}">${safe(c.symbol)}</div><div class="roster-info"><strong>${safe(c.name)}</strong><small>${safe(c.role)}</small></div><span class="roster-power">${c.power}</span></div>`}).join('')+Array.from({length:empty},(_,j)=>`<div class="roster-item empty"><span class="slot-index">0${team.length+j+1}</span><span style="font-size:10px;font-weight:800">Freier Platz</span></div>`).join('');
      return `<section class="team-panel team-${i?'b':'a'}" aria-label="Team ${i?'B':'A'}"><div class="team-kicker">TEAM ${i?'B':'A'} · ${team.length}/5</div><h2 class="team-name">${safe(state.names[i])}</h2><div class="budget"><span class="budget-label">RESTBUDGET</span><strong class="budget-value">${money(state.money[i])}</strong></div><div class="team-roster">${rows}</div></section>`;
    }
    function characterCard(){
      const onReveal=state.phase==='reveal';const shownIndex=onReveal?state.last.round:state.round+1;const c=charOf(onReveal?state.last.id:state.order[state.round]);const rarity=c.power>=97?'MYTHISCH':c.power>=92?'LEGENDÄR':c.power>=86?'EPISCH':'SELTEN';
      return `<div class="stage-top"><span>AKTUELLER DROP</span><span class="rarity">✦ ${rarity}</span></div>
        <div class="character-stage fade-in" style="--light:${c.color}99;--shade:${c.color}77">
          <span class="character-symbol" aria-hidden="true">${safe(c.symbol)}</span>
          <span class="character-index">${String(shownIndex).padStart(2,'0')} / ${TOTAL} · ${safe(c.faction)}</span>
          <h2>${safe(c.name)}</h2><span class="character-description">${safe(c.role)}</span></div>
        <div class="character-stats"><div class="stat"><span>Power</span><b class="highlight">${c.power}</b></div><div class="stat"><span>Typ</span><b style="font-size:16px">${safe(c.faction)}</b></div></div>`;
    }
    function bidStage(){
      if(state.phase==='handoff'){
        const i=state.turn;
        return `<div class="handoff fade-in"><div class="handoff-icon">🔒</div><h2>HANDY WEITERGEBEN</h2><p>Das Gebot wurde gespeichert und bleibt geheim. Jetzt ist <strong style="color:white">${safe(state.names[i])}</strong> dran.</p><button id="revealBidding" class="primary" type="button">Ich bin ${safe(state.names[i])} →</button></div>`;
      }
      if(state.phase==='reveal'){
        const e=state.last,c=charOf(e.id);const free=e.price===0;
        return `<div class="reveal fade-in"><div class="reveal-emblem">${free?'🎁':'🏆'}</div><div class="eyebrow" style="color:#ffd19b">${safe(c.name)} geht an</div><h2>${safe(state.names[e.winner])}!</h2><p>${safe(e.reason)} · ${free?'Kostenlos erhalten':money(e.price)+' bezahlt'}</p><div class="bid-compare"><div class="compare-tile">${safe(state.names[0])}<b>${money(e.bids[0])}</b></div><div class="compare-tile">${safe(state.names[1])}<b>${money(e.bids[1])}</b></div></div><button id="nextRound" type="button" class="primary full">${state.round===TOTAL?'Finale ansehen':'Nächster Charakter'} →</button></div>`;
      }
      const i=state.turn,p=state.names[i],cash=state.money[i];
      return `<div class="bid-zone fade-in"><div class="bid-heading"><span class="bid-title">DEIN GEBOT</span><span class="bid-side">${safe(p)} · max. ${money(cash)}</span></div>
      <p class="bid-turn">Biete jetzt auf diesen Charakter. Der andere Spieler sieht dein Gebot nicht.</p>
      <div class="bid-meter"><strong id="bidAmount" class="bid-amount">${draftAmount}</strong><span class="bid-euro">€</span></div>
      <input aria-label="Gebot in Euro" id="bidSlider" class="bid-slider" type="range" min="0" max="${cash}" step="1" value="${draftAmount}" />
      <div class="quick-bids"><button type="button" data-quick="0">Passen</button><button type="button" data-quick="3" ${cash<3?'disabled':''}>3 €</button><button type="button" data-quick="5" ${cash<5?'disabled':''}>5 €</button><button type="button" data-quick="10" ${cash<10?'disabled':''}>10 €</button><button type="button" data-quick="max">Alles</button></div>
      <button id="submitBid" class="primary full" type="button">Gebot geheim abgeben →</button>
      <p class="bid-notice">Du kennst die kommenden Charaktere nicht. Behalte dein Budget im Blick.</p></div>`;
    }
    function getSynergies(ids){const names=ids.map(id=>charOf(id).name);return (synergyRules[state.universe]||[]).filter(([members])=>members.every(n=>names.includes(n))).map(([_,bonus,label])=>({bonus,label}));}
    function calcScore(i){const power=teamTotal(i),synergies=getSynergies(state.teams[i]);return {power,synergies,score:power+synergies.reduce((s,b)=>s+b.bonus,0)};}
    function finalPanel(i){const d=calcScore(i);const team=state.teams[i];return `<section class="final-panel ${i?'b':'a'}"><div class="team-kicker">TEAM ${i?'B':'A'}</div><div class="final-name">${safe(state.names[i])}</div><div class="final-score">${d.score}</div><div class="score-label">Gesamtstärke</div><div class="result-roster">${team.map(id=>{const c=charOf(id);return `<div class="result-row"><span>${safe(c.name)}</span><span>${c.power} PWR</span></div>`}).join('')}</div><div class="synergy-section">Basisstärke: <b>${d.power}</b>${d.synergies.length?d.synergies.map(e=>`<span class="synergy-chip">✦ ${safe(e.label)} +${e.bonus}</span>`).join(''):'<span class="synergy-chip" style="color:#979cb7">Keine Spezial-Synergie</span>'}</div><div class="score-total"><span>Übrig: ${money(state.money[i])}</span><b>${d.score} PUNKTE</b></div></section>`;}
    function historyPanel(){return `<details class="history-panel"><summary>Auktionsverlauf ansehen (${state.history.length} Runden)</summary><div>${state.history.map(e=>`<div class="history-entry"><span>#${e.round} <strong>${safe(charOf(e.id).name)}</strong></span><span>${safe(state.names[e.winner])} · ${money(e.price)}${e.reason.startsWith('Rest')?' (Rest)':''}</span></div>`).join('')}</div></details>`;}
    function renderFinal(){const a=calcScore(0),b=calcScore(1),w=a.score===b.score?-1:a.score>b.score?0:1;const auto=state.automatic||[];return `<div class="fade-in"><div class="end-header"><div class="eyebrow">DIE ENTSCHEIDUNG</div><h1>TEAM A <span style="color:var(--orange)">VS</span> TEAM B</h1><p>Alle zehn Charaktere wurden verteilt. Wer hat das stärkere Team ersteigert?</p></div>
      <div class="winner-card"><div class="trophy">${w<0?'🤝':'🏆'}</div><div class="winner-tag">${w<0?'UNENTSCHIEDEN':'DAS SIEGERTEAM'}</div><div class="winner-name">${w<0?'Gleichstand!':safe(state.names[w])}</div><div class="winner-note">${w<0?'Beide Teams erreichen exakt denselben Power-Wert.':`${Math.abs(a.score-b.score)} Punkte Vorsprung – ${safe(state.names[w])} gewinnt das Duell!`}</div></div>
      ${auto.length?`<div class="legend" style="max-width:860px;margin:0 auto 20px"><strong>🎁 Automatische Restverteilung:</strong> ${auto.map(e=>`${safe(charOf(e.id).name)} → ${safe(state.names[e.winner])}`).join(' · ')}. Sobald kein reguläres Bieten mehr möglich ist, werden die restlichen Charaktere kostenlos auf freie Plätze verteilt.</div>`:''}
      <div class="final-grid">${finalPanel(0)}${finalPanel(1)}</div><div class="final-actions"><button id="rematch" type="button" class="primary">⚡ Neues zufälliges Duell</button><button id="sameSet" type="button" class="secondary">↺ Mit gleichen 10 spielen</button><button id="home" type="button" class="secondary">Thema wechseln</button></div>${historyPanel()}
      <p class="toastline">Das Urteil basiert auf spielerischen Power-Werten + Team-Synergien, nicht auf offiziellen Ranglisten.</p></div>`;}
    function renderGame(){
      if(state.phase==='final')return renderFinal();
      return `<div class="fade-in"><div class="gamehead"><div><div class="eyebrow">${safe(catalog[state.universe].name)} · ${safe(catalog[state.universe].tagline)}</div><h1>RUNDE ${String(state.phase==='reveal'?state.round:state.round+1).padStart(2,'0')} <span style="color:#777e9f">/ ${TOTAL}</span></h1></div><div class="pill" style="align-self:center">🎴 2 SPIELER</div></div>
      <div class="round-tracker" aria-label="Rundenfortschritt">${Array.from({length:TOTAL},(_,i)=>`<div class="round-dot ${i<state.round?'past':i===state.round?'current':''}"></div>`).join('')}</div>
      <div class="game-grid">${teamPanel(0)}<div class="center-content"><section class="auction-panel">${state.phase==='handoff'?'':characterCard()}${bidStage()}</section></div>${teamPanel(1)}</div>
      <div class="legend"><strong>So funktioniert's:</strong> Ihr habt jeweils 20 €. Beide bieten geheim auf denselben Charakter. Das höchste Gebot gewinnt und wird vom Budget abgezogen. Bei Gleichstand erhält das Team mit weniger Charakteren den Zuschlag; sonst wechselt das Vorrecht. Bei 0 € setzt du mit Bieten aus. Wer schon 5 Charaktere hat, muss aussetzen. Übrige Charaktere werden kostenlos zugeteilt.</div>
      <div class="legend-inline"><span>✦ 10 zufällige Charaktere</span><span>✦ 5 pro Team</span><span>✦ Keine zukünftigen Drops sichtbar</span></div></div>`;
    }
    function renderSetup(){
      const opts=Object.entries(catalog).map(([key,u])=>`<button class="universe ${setup.universe===key?'active':''}" data-universe="${key}" aria-pressed="${setup.universe===key}" type="button"><span class="uni-icon">${u.icon}</span><span><span class="uni-title">${safe(u.name)}</span><br/><span class="uni-sub">${safe(u.tagline)}</span></span></button>`).join('');
      return `<div class="hero fade-in"><section><div class="eyebrow">WILLKOMMEN IN DER AUKTIONS-ARENA</div><h1>BID.<span>BUILD.</span> BATTLE.</h1><p>20 € in der Tasche. Zehn unbekannte Charaktere. Zwei rivalisierende Teams. Biete clever, stelle dein Dream-Team zusammen und gewinne das Anime-Duell.</p><div class="features"><span class="feature">⚡ 2 Spieler</span><span class="feature">💰 20 € Startgeld</span><span class="feature">🎴 10 Charaktere</span><span class="feature">🏆 1 Gewinner</span></div><div class="hero-art" aria-hidden="true"><div class="art-halo"></div><div class="art-card back"><span class="art-symbol">忍</span>TEAM A</div><div class="art-card front"><span class="art-symbol">⚡</span>TEAM B</div></div></section>
        <section class="set-card"><div class="section-label">01 / WÄHLE DEIN UNIVERSUM</div><div class="universes">${opts}</div><div class="section-label">02 / WER SPIELT MIT?</div><div class="names"><div class="field"><label for="playerA"><span class="player-indicator"></span> TEAM A</label><input class="name-input" id="playerA" maxlength="16" value="${safe(setup.names[0])}" autocomplete="off"></div><div class="field"><label for="playerB"><span class="player-indicator p2"></span> TEAM B</label><input class="name-input" id="playerB" maxlength="16" value="${safe(setup.names[1])}" autocomplete="off"></div></div><div class="section-label" style="margin-top:5px">03 / STARTE DIE AUKTION</div><button class="primary full" id="startGame" type="button">⚡ Jetzt spielen <span aria-hidden="true">→</span></button><div class="subtext">Kostenlos · Ohne Anmeldung · Lokal auf einem Gerät</div></section></div>`;
    }
    function render(){app.innerHTML=state?renderGame():renderSetup();resetTop.hidden=!state;bindEvents();}
    function bindEvents(){
      if(!state){
        app.querySelectorAll('[data-universe]').forEach(btn=>btn.addEventListener('click',()=>{setup.universe=btn.dataset.universe;setup.names=[document.getElementById('playerA').value,document.getElementById('playerB').value];render()}));
        document.getElementById('playerA').addEventListener('input',e=>setup.names[0]=e.target.value);
        document.getElementById('playerB').addEventListener('input',e=>setup.names[1]=e.target.value);
        document.getElementById('startGame').addEventListener('click',()=>newGame());
        return;
      }
      if(state.phase==='auction'){
        const slider=document.getElementById('bidSlider');slider.addEventListener('input',e=>{draftAmount=Number(e.target.value);document.getElementById('bidAmount').textContent=draftAmount;});
        app.querySelectorAll('[data-quick]').forEach(el=>el.addEventListener('click',()=>{draftAmount=el.dataset.quick==='max'?state.money[state.turn]:Number(el.dataset.quick);slider.value=draftAmount;document.getElementById('bidAmount').textContent=draftAmount;}));
        document.getElementById('submitBid').addEventListener('click',()=>placeBid(draftAmount));
      }
      if(state.phase==='handoff')document.getElementById('revealBidding').addEventListener('click',()=>{state.phase='auction';draftAmount=0;save();render()});
      if(state.phase==='reveal')document.getElementById('nextRound').addEventListener('click',afterReveal);
      if(state.phase==='final'){
        document.getElementById('rematch').addEventListener('click',()=>{setup={universe:state.universe,names:[...state.names]};newGame(false)});
        document.getElementById('sameSet').addEventListener('click',()=>newGame(true));
        document.getElementById('home').addEventListener('click',()=>{setup={universe:state.universe,names:[...state.names]};state=null;clearSave();render();window.scrollTo(0,0)});
      }
    }
    resetTop.addEventListener('click',startNew);
    // Recover gracefully if an old or partially written save is malformed.
    try{if(state){if(state.phase==='auction'&&state.bids[state.turn]!==null){state.phase='handoff';}if(state.round===TOTAL&&state.phase!=='reveal')state.phase='final';}}catch(e){state=null;clearSave();}
    render();
  </script>
</body>
</html>
