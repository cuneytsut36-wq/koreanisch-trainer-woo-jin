function courses(){return `<h1>Lektionen</h1><p class="muted">Deutsch ↔ Koreanisch in lateinischer Umschrift.</p>${levelTabs()}${tiles()}`}
function lesson(){let l=selected();let n=l.words.filter((w,i)=>known()[l.id+':'+i]).length;return `<button class="btn secondary" onclick="go('courses')">← Lektionen</button><div class="section"><h2>${l.icon} ${esc(l.name)}</h2><span class="pill">${l.level}</span></div><p class="muted">${esc(l.description)} · ${n} von ${l.words.length} gelernt</p><div class="panel"><div class="vocab">${l.words.map((w,i)=>`<div><b>${esc(w[0])}</b><small>${esc(w[1])}</small><div class="actions" style="margin-top:10px"><button class="btn secondary" onclick="speak('${esc(w[0]).replaceAll("'","\\'")}')">🔊 Hören</button><button class="btn secondary" onclick="toggleKnown('${l.id}:${i}')">${known()[l.id+':'+i]?'✓ Gelernt':'○ Merken'}</button><button class="btn secondary" onclick="toggleFav('${l.id}:${i}')">${fav()[l.id+':'+i]?'♥':'♡'}</button></div></div>`).join('')}</div><div class="actions" style="margin-top:20px"><button class="btn" onclick="startQuiz('${l.id}')">Quiz zu dieser Lektion</button><button class="btn secondary" onclick="state.idx=0;state.flip=false;go('cards')">Mit Lernkarten üben</button></div></div>`}
function toggleKnown(id){let first=!known()[id];state.known={...known(),[id]:first};if(first){gainXP(3,'Vokabel gelernt');scheduleReview(id,true)}persist();render()}function toggleFav(id){state.fav={...fav(),[id]:!fav()[id]};persist();render()}
function cards(){let l=selected();let w=l.words[state.idx]||l.words[0];return `<h1>🗂️ Lernkarten</h1><div class="actions"><select id="deck" onchange="state.lesson=this.value;state.idx=0;state.flip=false;persist();render()" style="padding:12px;border-radius:12px;border:1px solid #cce4e2">${lessons.filter(l=>l.level===state.level).map(x=>`<option value="${x.id}" ${x.id===l.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select><span class="muted">${state.idx+1} / ${l.words.length}</span></div><div class="flash" onclick="state.flip=!state.flip;render()"><span>${state.flip?'DEUTSCH':'KOREANISCH'} · Antippen zum Umdrehen</span><strong>${esc(w[state.flip?1:0])}</strong></div><div class="actions"><button class="btn secondary" onclick="state.idx=Math.max(0,state.idx-1);state.flip=false;render()">← Zurück</button><button class="btn secondary" onclick="speak('${esc(w[0]).replaceAll("'","\\'")}')">🔊 Hören</button><button class="btn secondary" onclick="toggleKnown('${l.id}:${state.idx}')">${known()[l.id+':'+state.idx]?'✓ Gelernt':'○ Merken'}</button><button class="btn" onclick="state.idx=Math.min(${l.words.length-1},state.idx+1);state.flip=false;render()">Weiter →</button></div><p class="tiny">Die Sprachausgabe nutzt die Koreanisch-Stimme deines Geräts, falls verfügbar.</p>`}
function quiz(){if(!state.quiz.length)return `<h1>Quiz</h1><button class="btn" onclick="startQuiz('all')">Starten</button>`;if(state.quizDone)return `<div class="panel" style="text-align:center;padding:45px 20px"><div style="font-size:48px">🏆</div><h1>${state.correct} / ${state.quiz.length}</h1><p>${state.correct===state.quiz.length?'Perfekt!':'Weiter üben lohnt sich!'}</p><button class="btn" onclick="startQuiz('all')">Neuer Test</button><button class="btn secondary" onclick="go('home')">Startseite</button></div>`;let q=state.quiz[state.q];return `<h1>🎯 Multiple-Choice-Quiz</h1><div class="muted">Frage ${state.q+1} von ${state.quiz.length} · ${state.correct} richtig</div><div class="bar"><div style="width:${state.q/state.quiz.length*100}%"></div></div><div class="panel"><p>Wie sagt man das auf Koreanisch?</p><div class="question">${esc(q.item.de)}</div><button class="btn secondary" onclick="speak('${esc(q.item.ko).replaceAll("'","\\'")}')">🔊 Anhören</button><div class="options" style="margin-top:20px">${q.opts.map((o,i)=>`<button ${state.answer!==null?'disabled':''} class="option ${state.answer!==null?(o.id===q.item.id?'correct':i===state.answer?'wrong':''):''}" onclick="answer(${i})"><b>${'ABCD'[i]}.</b> ${esc(o.ko)}${state.answer!==null?`<small class="quiz-translation">${esc(o.de)}</small>`:''}</button>`).join('')}</div>${state.answer!==null?`<div class="notice">${q.opts[state.answer].id===q.item.id?'✓ Richtig!':'Nicht ganz.'} <b>${esc(q.item.ko)}</b> = ${esc(q.item.de)}</div><button class="btn" onclick="nextQuestion()">${state.q===state.quiz.length-1?'Ergebnis anzeigen':'Nächste Frage →'}</button>`:''}</div>`}
function answer(i){if(state.answer!==null)return;state.answer=i;let ok=state.quiz[state.q].opts[i].id===state.quiz[state.q].item.id;if(ok){state.correct++;gainXP(10,'Richtige Antwort')}else gainXP(2,'Weiterlernen');scheduleReview(state.quiz[state.q].item.id,ok);state.attempts=[...attempts(),{date:day(),ok,level:state.level}];persist();render()}function nextQuestion(){if(state.q===state.quiz.length-1){state.quizDone=true;gainXP(25,'Quiz abgeschlossen')}else{state.q++;state.answer=null}persist();render()}
const nums={0:'',1:'il',2:'i',3:'sam',4:'sa',5:'o',6:'yuk',7:'chil',8:'pal',9:'gu'};function koreanNum(n){if(n===100)return 'Baek';return ((n>=10?(n>=20?nums[Math.floor(n/10)]:'')+'sip':'')+(n%10?nums[n%10]:'')).replace(/^./,x=>x.toUpperCase())}function numbers(){let n=state.number??23;return `<h1>🔢 Zahlentrainer</h1><div class="panel"><p>Übe die sino-koreanischen Zahlen von 1 bis 100.</p><div class="actions"><input type="number" min="1" max="100" value="${n}" oninput="state.number=Math.max(1,Math.min(100,Number(this.value)||1));document.getElementById('numResult').textContent=koreanNum(state.number)"><button class="btn secondary" onclick="state.number=Math.floor(Math.random()*100)+1;render()">🎲 Zufallszahl</button></div><div class="flash" style="min-height:160px"><span>KOREANISCH</span><strong id="numResult">${koreanNum(n)}</strong></div><p class="tiny">Die Zahlen werden in lateinischer Umschrift angezeigt.</p></div>`}
function progress(){let days=[...Array(7)].map((_,i)=>{let d=new Date();d.setDate(d.getDate()-(6-i));let ds=d.toLocaleDateString('sv-SE');return {day:d.toLocaleDateString('de-DE',{weekday:'short'}),count:attempts().filter(a=>a.date===ds).length}});return `<h1>📊 Dein Fortschritt</h1>${stats()}<div class="panel"><h2>Letzte 7 Tage</h2><div style="display:flex;align-items:end;gap:12px;height:175px">${days.map(d=>`<div style="flex:1;text-align:center"><div style="height:125px;display:flex;align-items:end"><div style="width:100%;height:${Math.max(4,Math.min(100,d.count*10))}%;background:#28b89a;border-radius:8px 8px 0 0"></div></div><small>${d.day}</small><div class="tiny">${d.count}</div></div>`).join('')}</div></div><div class="panel"><h2>Gelernte Wörter</h2><p>${Object.values(known()).filter(Boolean).length} von ${all.length} Lernkarten markiert</p><div class="bar"><div style="width:${Object.values(known()).filter(Boolean).length/all.length*100}%"></div></div><h2>Favoriten</h2>${all.filter(w=>fav()[w.id]).map(w=>`<div class="lessonrow"><div><b>${esc(w.ko)}</b><div class="muted">${esc(w.de)}</div></div><button class="btn secondary" onclick="speak('${esc(w.ko).replaceAll("'","\\'")}')">🔊</button></div>`).join('')||'<p class="muted">Noch keine Favoriten gespeichert.</p>'}<div class="actions" style="margin-top:18px"><button class="btn secondary" onclick="exportData()">⬇ Daten sichern</button><button class="btn secondary" onclick="document.getElementById('import').click()">⬆ Daten importieren</button><input class="hidden" type="file" id="import" accept="application/json" onchange="importData(this.files[0])"></div><p class="tiny">Daten bleiben auf diesem Gerät im Browser gespeichert. Exportiere eine Sicherung für Gerätewechsel oder Neuinstallation.</p></div>`}
function exportData(){let b=new Blob([JSON.stringify({...state,quiz:[]},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='koreanisch-trainer-fortschritt.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}async function importData(f){if(!f)return;try{let x=JSON.parse(await f.text());if(!x||typeof x!=='object'||Array.isArray(x))throw Error();state={...state,...x,quiz:[],page:'progress'};persist();render();alert('Fortschritt importiert.')}catch{alert('Die Datei konnte nicht importiert werden.')}}
function xp(){return Number(state.xp)||0}
function levelNum(){return Math.floor(xp()/100)+1}
function gainXP(n,label){state.xp=xp()+n;setTimeout(()=>{const t=document.createElement('div');t.className='toast-xp';t.textContent='✨ +'+n+' XP · '+label;document.body.appendChild(t);setTimeout(()=>t.remove(),1700)},20)}
function streak(){const ds=[...new Set(attempts().map(a=>a.date))];let n=0;let d=new Date();if(!ds.includes(day()))d.setDate(d.getDate()-1);while(ds.includes(d.toLocaleDateString('sv-SE'))){n++;d.setDate(d.getDate()-1)}return n}
function rewardSummary(){return `<div class="reward-strip"><div class="reward-chip">⚡ ${xp()} XP<small>Level ${levelNum()}</small><div class="xp-track"><div style="width:${xp()%100}%"></div></div></div><div class="reward-chip">🔥 ${streak()} Tage<small>Lernserie</small></div><div class="reward-chip">🎯 ${Math.min(todayCount(),10)}/10<small>Heute beantwortet</small></div><div class="reward-chip">🏅 ${badges().filter(b=>b.ok).length} / ${badges().length}<small>Abzeichen</small></div></div>`}
function badges(){return [{icon:'🌱',name:'Erste Schritte',desc:'Erste Quizantwort',ok:attempts().length>=1},{icon:'⭐',name:'100 XP',desc:'100 Erfahrungspunkte',ok:xp()>=100},{icon:'🏆',name:'Quiz-Profi',desc:'50 Antworten',ok:attempts().length>=50},{icon:'📚',name:'Wortschatz',desc:'20 Lernkarten gelernt',ok:Object.values(known()).filter(Boolean).length>=20},{icon:'🔥',name:'Dranbleiben',desc:'3 Tage in Folge',ok:streak()>=3},{icon:'💎',name:'500 XP',desc:'500 Erfahrungspunkte',ok:xp()>=500}]}
function rewards(){return `<h1>🏆 Belohnungen & XP</h1><p class="muted">Richtige Quizantwort: +10 XP · Fehler: +2 XP · Vokabel lernen: +3 XP · Quiz beenden: +25 XP</p>${rewardSummary()}<h2>Deine Abzeichen</h2><div class="badge-grid">${badges().map(b=>`<div class="achievement ${b.ok?'':'locked'}"><div class="emoji">${b.icon}</div><strong>${b.name}</strong><p class="muted">${b.desc}</p><small>${b.ok?'✓ Freigeschaltet':'🔒 Noch gesperrt'}</small></div>`).join('')}</div>`}

function openClip(i){state.clip=i;state.clipLine=0;persist();render()}
function clipNext(){const scene=scenes[state.clip||0];state.clipLine=(state.clipLine+1)%scene.lines.length;persist();render()}

function clips(){let i=state.clip||0,sc=scenes[i],j=Math.min(state.clipLine||0,sc.lines.length-1),line=sc.lines[j];return `<h1>🎬 Mini-Dialog-Clips</h1><p class="muted">Kurze animierte Szenen mit koreanischer Sprachausgabe und deutscher Übersetzung. Tippe auf „Anhören“, um die Voiceline abzuspielen.</p><div class="actions">${scenes.map((s,k)=>`<button class="btn ${i===k?'':'secondary'}" onclick="openClip(${k})">${s.title} · ${s.level}</button>`).join('')}</div><div class="clip-card celebrate"><div class="clip-person">${line[0]}</div><div class="clip-line">${esc(line[1])}</div><div class="clip-de">${esc(line[2])}</div><div class="clip-progress">${sc.lines.map((_,k)=>`<span class="${k<=j?'active':''}"></span>`).join('')}</div></div><div class="actions"><button class="btn" onclick="playClip()">🔊 Voiceline anhören</button><button class="btn secondary" onclick="clipNext()">Nächste Szene →</button><button class="btn secondary" onclick="state.clipLine=0;render()">↻ Wiederholen</button></div><p class="tiny">Diese Clips sind animierte Textdialoge, keine Videodateien. Die Aussprache hängt von den installierten Stimmen deines Geräts ab.</p>`}

t;')})" aria-label="Koreanische Aussprache anhören"><span>◖))</span> Aussprache anhören</button></div><div class="reel-actions"><button class="${fav()[w.id]?'is-active':''}" onclick="feedLike('${w.id}')" aria-label="Favorit"><span>${fav()[w.id]?'♥':'♡'}</span><small>Merken</small></button><button class="${known()[w.id]?'is-active':''}" onclick="feedLearn('${w.id}')" aria-label="Als gelernt markieren"><span>${known()[w.id]?'✓':'＋'}</span><small>Gelernt</small></button><button onclick="speak(${JSON.stringify(w.ko).replace(/"/g,'&quot;')})" aria-label="Anhören"><span>♫</span><small>Hören</small></button></div><div class="reel-footer"><span>↑ Wischen für nächste Vokabel</span><div class="reel-dashes"><span></span><span></span><span></span></div></div></section>`).join(''):`<div class="feed-empty"><div>♡</div><h2>Noch keine Favoriten</h2><p>Markiere Vokabeln mit dem Herz, um sie hier zu wiederholen.</p><button class="btn" onclick="feedFavOnly()">Alle Vokabeln ansehen</button></div>`}</div><div class="feed-side-controls"><button onclick="feedMove(-1)" aria-label="Vorherige Vokabel">↑</button><button onclick="feedMove(1)" aria-label="Nächste Vokabel">↓</button><span id="feedPosition">${items.length?start+1:0} / ${items.length}</span></div></div><div class="feed-under"><span>✦ +3 XP für jede neu gelernte Vokabel</span><button class="btn secondary" onclick="go('home')">Zur Übersicht →</button></div>`}
function setFeedTopic(t){state.feedTopic=t;state.feedIndex=0;persist();render()}
function feedSetLevel(l){state.feedLevel=l;state.feedTopic='';state.feedIndex=0;persist();render()}
function feedFavOnly(){state.feedFavorites=!state.feedFavorites;state.feedIndex=0;persist();render()}
function feedLike(id){state.fav={...fav(),[id]:!fav()[id]};persist();renderFeedKeepPosition()}
function feedLearn(id){const fresh=!known()[id];state.known={...known(),[id]:fresh};if(fresh){gainXP(3,'Vokabel gelernt');scheduleReview(id,true)}persist();renderFeedKeepPosition()}
function renderFeedKeepPosition(){const sc=document.getElementById('feedScroll');const pos=sc?sc.scrollTop:0;render();const next=document.getElementById('feedScroll');if(next)next.scrollTop=pos}
function feedMove(d){const sc=document.getElementById('feedScroll');if(!sc)return;const next=Math.max(0,Math.min(feedItems().length-1,(state.feedIndex||0)+d));sc.scrollTo({top:next*sc.clientHeight,behavior:'smooth'})}
function setupFeed(){if(feedObserver)feedObserver.disconnect();const sc=document.getElementById('feedScroll');if(!sc)return;const reels=[...sc.querySelectorAll('.reel')];if(!reels.length)return;sc.scrollTop=Math.max(0,Math.min(state.feedIndex||0,reels.length-1))*sc.clientHeight;feedObserver=new IntersectionObserver(entries=>{for(const e of entries){if(e.isIntersecting&&e.intersectionRatio>.55){state.feedIndex=Number(e.target.dataset.index);const counter=document.getElementById('feedPosition');if(counter)counter.textContent=`${state.feedIndex+1} / ${reels.length}`;persist()}}},{root:sc,threshold:[.55,.75]});reels.forEach(r=>feedObserver.observe(r))}
window.addEventListener('keydown',e=>{if(state.page==='feed'&&['ArrowDown','ArrowUp'].includes(e.key)&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){e.preventDefault();feedMove(e.key==='ArrowDown'?1:-1)}});

// SM-2 inspired spaced repetition, persisted in the existing local profile.
function scheduleReview(id,correct){if(!id)return;const records=state.srs||{};const old=records[id]||{box:0};const box=correct?Math.min(5,(old.box||0)+1):0;const intervals=[0,1,3,7,14,30];const date=new Date();date.setDate(date.getDate()+intervals[box]);state.srs={...records,[id]:{box,due:date.toLocaleDateString('sv-SE'),last:day()}}}
function dueWords(){return all.filter(w=>{const r=(state.srs||{})[w.id];return r&&r.due<=day()}).sort((a,b)=>(state.srs[a.id].box||0)-(state.srs[b.id].box||0))}
function review(){const due=dueWords();const idx=Math.min(state.reviewIndex||0,Math.max(0,due.length-1));const w=due[idx];return `<div class="eyebrow">SMART REVIEW</div><h1>Wiederholen ↻</h1><p class="muted">Wörter erscheinen erneut, wenn ihre Wiederholung fällig ist. Nach einem Fehler kommen sie früher zurück.</p><div class="review-count"><b>${due.length}</b><span>heute fällige Wörter</span></div>${w?`<div class="review-card"><small>${w.level} · ${idx+1}/${due.length}</small><h2>${esc(w.ko)}</h2><p>${state.reviewReveal?esc(w.de):'Übersetzung noch verdeckt'}</p><button class="btn secondary" onclick="speak(${JSON.stringify(w.ko).replace(/"/g,'&quot;')})">♫ Anhören</button></div><div class="actions">${!state.reviewReveal?`<button class="btn" onclick="state.reviewReveal=true;render()">Übersetzung zeigen</button>`:`<button class="btn secondary" onclick="reviewRate('${w.id}',false)">Noch nicht gewusst</button><button class="btn" onclick="reviewRate('${w.id}',true)">Gewusst +5 XP</button>`}</div>`:`<div class="review-card"><h2>Alles geschafft! ✦</h2><p>Heute ist nichts mehr fällig. Du kannst trotzdem weitere Vokabeln lernen.</p><button class="btn" onclick="go('feed')">Neue Vokabeln entdecken</button></div>`}<div class="actions"><button class="btn secondary" onclick="startQuiz('all')">Tagesquiz starten</button></div>`}
function reviewRate(id,ok){scheduleReview(id,ok);if(ok)gainXP(5,'Wiederholung');state.reviewReveal=false;state.reviewIndex=0;persist();render()}
function path(){const lv=state.level;const list=lessons.filter(l=>l.level===lv);return `<div class="eyebrow">DEIN KURS</div><h1>Dein Lernpfad ◇</h1><p class="muted">Lerne ein Thema nach dem anderen. Zu jeder Lektion gibt es Wörter, Aussprache und ein Quiz.</p>${levelTabs()}<div class="path-list">${list.map((l,i)=>{const n=l.words.filter((w,j)=>known()[l.id+':'+j]).length;const pct=Math.round(n/l.words.length*100);return `<button class="path-node" onclick="openLesson('${l.id}')"><span class="path-step">${i+1}</span><span class="path-body"><b>${l.icon} ${esc(l.name)}</b><small>${n}/${l.words.length} Wörter gelernt · ${pct}%</small><span class="path-meter"><i style="width:${pct}%"></i></span></span><span class="path-arrow">›</span></button>`}).join('')}</div><p class="muted">Der Lernpfad bietet strukturierte Übungen. Eine Einstufung oder Zertifizierung wird nicht automatisch vergeben.</p>`}
const speakingScenes=[
{level:'A1',name:'Im Café',intro:'Annyeonghaseyo! Mwo deurilkkayo?',de:'Guten Tag! Was darf es sein?',sample:'Keopi han jan juseyo.',translation:'Einen Kaffee bitte.',keys:['keopi','juseyo']},

let voiceRecorder=null,voiceChunks=[],voiceUrl=null;
function coach(){const i=state.coachIndex||0,scene=speakingScenes[i];return `<div class="eyebrow">SPEAKING STUDIO</div><h1>Sprich Koreanisch ◉</h1><p class="muted">Übe Dialoge, höre eine Beispielantwort und nimm deine Stimme auf. Mit der Selbstkontrolle kannst du deine Aussprache vergleichen.</p><div class="media-tabs">${speakingScenes.map((x,j)=>`<button class="${j===i?'active':''}" onclick="state.coachIndex=${j};state.coachFeedback='';persist();render()">${x.level} · ${x.name}</button>`).join('')}</div><div class="coach-stage"><span class="eyebrow">DEIN GESPRÄCHSPARTNER · ${scene.level}</span><div class="coach-avatar">◉</div><h2>${esc(scene.intro)}</h2><p>${esc(scene.de)}</p><button class="btn secondary" onclick="speak(${JSON.stringify(scene.intro).replace(/"/g,'&quot;')})">♫ Frage anhören</button></div><div class="coach-answer"><small>DEINE ANTWORT · BEISPIEL</small><h3>${esc(scene.sample)}</h3><p>${esc(scene.translation)}</p><div class="actions"><button class="btn secondary" onclick="speak(${JSON.stringify(scene.sample).replace(/"/g,'&quot;')})">♫ Beispiel anhören</button><button class="btn" id="recordBtn" onclick="toggleRecording()">● Eigene Stimme aufnehmen</button></div><div id="recordStatus" class="record-status">Für die Aufnahme benötigt dein Browser Mikrofonzugriff und eine sichere HTTPS-Verbindung.</div><div id="recordPlayback"></div></div><div class="coach-answer"><small>ANTWORT IN LATEINISCHER UMSCHRIFT</small><textarea id="coachText" rows="3" placeholder="Schreibe deine Antwort, z. B. ${esc(scene.sample)}"></textarea><div class="actions"><button class="btn" onclick="checkCoachText()">Antwort prüfen</button><button class="btn secondary" onclick="document.getElementById('coachText').value=${JSON.stringify(scene.sample).replace(/"/g,'&quot;')}">Beispiel einsetzen</button></div><div id="coachFeedback" class="record-status">Die Textprüfung erkennt passende Schlüsselwörter. Sie ist keine KI und bewertet weder Grammatik noch Aussprache zuverlässig.</div></div>`}
function checkCoachText(){const scene=speakingScenes[state.coachIndex||0];const v=(document.getElementById('coachText').value||'').toLowerCase().replace(/[^a-z ]/g,' ');const found=scene.keys.filter(k=>v.includes(k));const target=document.getElementById('coachFeedback');if(!v.trim()){target.textContent='Schreibe zuerst eine Antwort.';return}target.textContent=found.length===scene.keys.length?'✓ Passende Schlüsselwörter gefunden! Vergleiche jetzt mit der Beispielantwort.':'Du hast '+found.length+' von '+scene.keys.length+' Schlüsselwörtern getroffen. Versuche es noch einmal oder nutze die Beispielantwort.';if(found.length===scene.keys.length){gainXP(8,'Sprechübung');persist()}}
async function toggleRecording(){const b=document.getElementById('recordBtn'),status=document.getElementById('recordStatus');if(voiceRecorder&&voiceRecorder.state==='recording'){voiceRecorder.stop();b.textContent='● Erneut aufnehmen';status.textContent='Aufnahme beendet. Du kannst sie gleich anhören.';return}if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){status.textContent='Dein Browser unterstützt die Aufnahme hier nicht. Öffne die App über HTTPS in einem aktuellen Browser.';return}try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});voiceChunks=[];voiceRecorder=new MediaRecorder(stream);voiceRecorder.ondataavailable=e=>{if(e.data.size)voiceChunks.push(e.data)};voiceRecorder.onstop=()=>{if(voiceUrl)URL.revokeObjectURL(voiceUrl);voiceUrl=URL.createObjectURL(new Blob(voiceChunks,{type:voiceRecorder.mimeType||'audio/webm'}));const p=document.getElementById('recordPlayback');if(p)p.innerHTML='<audio controls src="'+voiceUrl+'"></audio><p class="muted">Die Aufnahme bleibt nur in dieser Sitzung und wird nicht hochgeladen.</p>';stream.getTracks().forEach(t=>t.stop())};voiceRecorder.start();b.textContent='■ Aufnahme stoppen';status.textContent='Aufnahme läuft … sprich deine Antwort laut.'}catch(e){status.textContent='Mikrofon nicht verfügbar oder Berechtigung abgelehnt.'}}
function challenge(){const a=attempts(),now=new Date(),start=new Date(now);start.setDate(now.getDate()-6);const recent=a.filter(x=>new Date(x.date)>=start);const knownCount=Object.values(known()).filter(Boolean).length;const quests=[['Tagesquiz',Math.min(todayCount(),10),10,'10 Quizantworten heute'],['Wochenfokus',Math.min(recent.length,50),50,'50 Quizantworten in 7 Tagen'],['Wortschatz',Math.min(knownCount,100),100,'100 Wörter als gelernt markieren'],['Level-Jäger',Math.min(xp(),500),500,'500 XP sammeln'],['Dranbleiben',Math.min(streak(),7),7,'7 Tage hintereinander üben']];return `<div class="eyebrow">DEINE CHALLENGES</div><h1>Missionen & Belohnungen ★</h1><p class="muted">Alle Aufgaben basieren auf deinen lokal gespeicherten Lernergebnissen. Keine erfundenen Online-Ranglisten.</p>${rewardSummary()}<div class="challenge-grid">${quests.map(([name,value,max,desc])=>`<div class="challenge-item"><div class="challenge-top"><b>${name}</b><span>${value}/${max}</span></div><p>${desc}</p><div class="path-meter"><i style="width:${value/max*100}%"></i></div><small>${value>=max?'🏆 Geschafft':'✦ Weiterlernen'}</small></div>`).join('')}</div><button class="btn" onclick="startQuiz('all')">Jetzt XP sammeln →</button>`}

const gameKinds=[['match','🧩','Paare finden','Ordne Koreanisch und Deutsch zu.'],['order','🔀','Satzbau','Bringe Wörter in die richtige Reihenfolge.'],['cloze','✍️','Lückentext','Ergänze den fehlenden Ausdruck.'],['listening','🎧','Hörquiz','Höre und erkenne die richtige Bedeutung.']];
const sentenceBank=[
['A1','Jeoneun keopireul masyeoyo','Ich trinke Kaffee.'],['A1','Oneul nalssiga joayo','Heute ist das Wetter gut.'],['A1','Jigeum jip-e gayo','Ich gehe jetzt nach Hause.'],['A2','Naeil chingureul mannayo','Morgen treffe ich einen Freund.'],['A2','Hangug-e gago sipeoyo','Ich möchte nach Korea reisen.'],['A2','Jogeum cheoncheonhi malhae juseyo','Bitte sprechen Sie etwas langsamer.'],['B1','Je saenggageneun geuge joayo','Meiner Meinung nach ist das gut.'],['B1','Sigan-i isseumyeon hamkke gayo','Wenn ich Zeit habe, gehen wir zusammen.'],['B1','Geu jeomeun ihaehaeyo','Diesen Punkt verstehe ich.'],['B2','Jangjeomgwa danjeomeul goryeohaeya haeyo','Wir sollten Vor- und Nachteile berücksichtigen.'],['B2','Je-an-e daehae geomtohae jusipsio','Bitte prüfen Sie den Vorschlag.'],['B2','Sanghwang-e ttara dallajyeoyo','Es hängt von der Situation ab.'],['C1','Bipanjeog geomtoga piryohamnida','Eine kritische Prüfung ist notwendig.'],['C1','Haeksim nonjeomeul jeongrihagetseumnida','Ich werde die Kernpunkte zusammenfassen.'],['C1','Dareun gwanjeom-eseo barabomyeon','Aus einer anderen Perspektive betrachtet.'],['C2','Sangho jonjung-eul batang-euro hyeopsanghaeya hamnida','Wir müssen auf Basis gegenseitigen Respekts verhandeln.'],['C2','Geureotdago danjeonghal su eopseoyo','Man kann es dennoch nicht eindeutig behaupten.'],['C2','Gyeoljeongjeog geungeoreul je-sihaeya hamnida','Man muss entscheidende Belege vorlegen.']
];
let gameRuntime={};
function gamePool(){let pool=all.filter(w=>w.level===state.level);return pool.length>=8?pool:all}
function newGame(kind){let pool=gamePool();gameRuntime={kind,score:0,round:0,done:false,feedback:'',selected:[],pool:shuffle(pool).slice(0,10)};prepareRound();go('games')}
function prepareRound(){let g=gameRuntime;if(g.round>=5){g.done=true;persist();return}g.feedback='';g.selected=[];if(g.kind==='match'){let words=shuffle(g.pool).slice(0,4);g.pairs=words;g.left=shuffle(words);g.right=shuffle(words);g.matched=[];g.first=null}else if(g.kind==='order'){let b=sentenceBank.filter(x=>x[0]===state.level);g.sentence=shuffle(b.length?b:sentenceBank)[0];g.parts=g.sentence[1].split(' ');g.remaining=shuffle(g.parts.map((word,i)=>({word,i})));g.placed=[]}else{g.word=shuffle(g.pool)[0];g.options=shuffle([g.word,...shuffle(poolDifferent(g.word)).slice(0,3)]);g.answer=null}}
function poolDifferent(w){return all.filter(x=>x.de!==w.de&&x.id!==w.id)}
function gamePick(side,index){let g=gameRuntime;if(g.feedback)return;if(!g.first){g.first={side,index};render();return}if(g.first.side===side){g.first={side,index};render();return}let l=side==='left'?g.left[index]:g.left[g.first.index],r=side==='right'?g.right[index]:g.right[g.first.index];if(l.id===r.id){g.matched.push(l.id);g.score+=5;gainXP(5,'Memory-Paar');g.first=null;if(g.matched.length===g.pairs.length)g.feedback='Alle Paare gefunden!'}else{g.feedback='Noch nicht ganz. Versuche es erneut.';g.first=null}render()}
function gameOrderPick(i){let g=gameRuntime;if(g.feedback)return;g.placed.push(g.remaining.splice(i,1)[0]);render()}
function gameOrderUndo(){let g=gameRuntime;if(!g.placed.length)return;g.remaining.push(g.placed.pop());render()}
function gameOrderCheck(){let g=gameRuntime;let ok=g.placed.map(x=>x.i).join(',')===g.parts.map((_,i)=>i).join(',');g.feedback=ok?'Richtig! +15 XP':'Die richtige Reihenfolge: '+g.sentence[1];if(ok){g.score+=15;gainXP(15,'Satzbau')}else gainXP(1,'Satzbau versucht');persist();render()}
function gameAnswer(i){let g=gameRuntime;if(g.answer!==null)return;g.answer=i;let ok=g.options[i].id===g.word.id;g.feedback=ok?'Richtig! +10 XP':'Richtig wäre: '+g.word.ko+' – '+g.word.de;if(ok){g.score+=10;gainXP(10,'Hör-/Lückentraining')}else gainXP(1,'Übung versucht');scheduleReview(g.word.id,ok);persist();render()}
function clearGameFeedback(){gameRuntime.feedback='';render()}
function gameNext(){gameRuntime.round++;prepareRound();render()}
function games(){let g=gameRuntime;if(!g.kind)return `<div class="eyebrow">SPIEL-ARCADE</div><h1>Spielen & lernen 🎮</h1><p class="muted">Vier Übungen mit XP. Deine aktuelle Stufe ist ${state.level}.</p>${levelTabs()}<div class="v11-tiles">${gameKinds.map(x=>`<button class="v11-tile" onclick="newGame('${x[0]}')"><span>${x[1]}</span><b>${x[2]}</b><small>${x[3]}</small></button>`).join('')}</div>`;
let body='';if(g.done)body=`<div class="v11-panel"><h2>🏆 Spiel abgeschlossen</h2><p>${g.score} Punkte in fünf Runden.</p><button class="btn" onclick="newGame('${g.kind}')">Noch einmal</button><button class="btn secondary" onclick="gameRuntime={};render()">Andere Spiele</button></div>`;
else if(g.kind==='match'){body=`<p>Tippe links und rechts auf zusammengehörige Wörter.</p><div class="v11-match"><div>${g.left.map((w,i)=>`<button ${g.matched.includes(w.id)?'disabled':''} class="${g.first?.side==='left'&&g.first.index===i?'chosen':''}" onclick="gamePick('left',${i})">${esc(w.ko)}</button>`).join('')}</div><div>${g.right.map((w,i)=>`<button ${g.matched.includes(w.id)?'disabled':''} class="${g.first?.side==='right'&&g.first.index===i?'chosen':''}" onclick="gamePick('right',${i})">${esc(w.de)}</button>`).join('')}</div></div>${g.feedback?`<div class="notice">${esc(g.feedback)}</div><button class="btn" onclick="${g.matched.length===4?'gameNext()':'clearGameFeedback()'}">${g.matched.length===4?'Weiter':'Erneut versuchen'}</button>`:''}`}
else if(g.kind==='order'){body=`<p>Baue diesen Satz auf: <b>${esc(g.sentence[2])}</b></p><div class="v11-slots">${g.placed.map(x=>`<span>${esc(x.word)}</span>`).join('')||'Tippe unten auf die Wörter'}</div><div class="v11-words">${g.remaining.map((x,i)=>`<button onclick="gameOrderPick(${i})">${esc(x.word)}</button>`).join('')}</div><div class="actions"><button class="btn secondary" onclick="gameOrderUndo()">↶ Zurück</button><button class="btn" ${g.remaining.length?'disabled':''} onclick="gameOrderCheck()">Prüfen</button></div>${g.feedback?`<div class="notice">${esc(g.feedback)}</div><button class="btn" onclick="gameNext()">Weiter</button>`:''}`}
else {let w=g.word;body=`<p>${g.kind==='listening'?'Höre den Ausdruck. Welche Umschrift passt?':'Wähle die passende koreanische Umschrift.'}</p><div class="v11-panel"><h2>${g.kind==='listening'?'🎧 Erst anhören':esc(w.de)}</h2>${g.kind==='listening'?`<button class="btn" onclick="speak(${JSON.stringify(w.ko).replace(/"/g,'&quot;')})">▶ Ausdruck abspielen</button>`:''}</div><div class="v11-answers">${g.options.map((x,i)=>`<button ${g.answer!==null?'disabled':''} onclick="gameAnswer(${i})">${esc(x.ko)}${g.answer!==null?`<small class="quiz-translation">${esc(x.de)}</small>`:''}</button>`).join('')}</div>${g.feedback?`<div class="notice">${esc(g.feedback)}</div><button class="btn" onclick="gameNext()">Weiter</button>`:''}`}
return `<div class="eyebrow">SPIEL-ARCADE · ${state.level}</div><h1>${gameKinds.find(x=>x[0]===g.kind)?.[2]}</h1><div class="v11-gamebar"><span>Runde ${g.round+1} / 5</span><b>⭐ ${g.score} Punkte</b></div>${body}<button class="btn secondary" onclick="gameRuntime={};render()">← Spieleübersicht</button>`}
function dailyPlan(){let due=dueWords();let weak=Object.entries((state.srs||{})).filter(([id,r])=>r.box<=1).length;let levelKnown=all.filter(w=>w.level===state.level&&known()[w.id]).length;let levelTotal=all.filter(w=>w.level===state.level).length;let goal=Number(state.dailyGoal)||30;let earned=attempts().filter(a=>a.date===day()).length*10;return `<div class="eyebrow">DEIN PERSÖNLICHER COACH</div><h1>Mein Tagesplan ✨</h1><p class="muted">Aus deinen gespeicherten Antworten und Wiederholungen lokal berechnet. Kein KI-Server.</p><div class="v11-panel"><div class="v11-gamebar"><strong>Heutiges Lernziel</strong><b>${earned} / ${goal} Aktivitätspunkte</b></div><div class="bar"><div style="width:${Math.min(100,earned/goal*100)}%"></div></div><label for="dailyGoal">Tagesziel</label><select id="dailyGoal" onchange="state.dailyGoal=Number(this.value);persist();render()">${[20,30,50,100].map(n=>`<option value="${n}" ${n===goal?'selected':''}>${n} Punkte</option>`).join('')}</select></div><div class="v11-plan"><button onclick="go('review')"><b>1 · Wiederholen</b><span>${due.length} fällige Wörter · ${weak} mit niedriger Sicherheit</span><em>→</em></button><button onclick="go('path')"><b>2 · Neues lernen</b><span>${levelKnown} / ${levelTotal} Wörter in ${state.level} gelernt</span><em>→</em></button><button onclick="newGame('listening')"><b>3 · Hörverständnis</b><span>Fünf Hörquiz-Runden</span><em>→</em></button><button onclick="go('coach')"><b>4 · Sprechen</b><span>Dialoge und eigene Sprachaufnahme</span><em>→</em></button></div><div class="v11-panel"><h2>Deine Lernempfehlung</h2><p>${due.length?'Du hast fällige Wörter. Beginne heute mit der Wiederholung, bevor du neue Vokabeln lernst.':'Aktuell sind keine Wiederholungen fällig. Starte mit einer neuen Lektion und einem Hörquiz.'}</p><button class="btn" onclick="go('${due.length?'review':'path'}')">Jetzt starten</button></div>`}
let localVideoURL=null;
function localMedia(){return `<div class="eyebrow">EIGENE MEDIEN · OFFLINE</div><h1>Meine Video-Reels 🎬</h1><p class="muted">Spiele eine eigene Videodatei direkt im Browser ab. Sie bleibt auf deinem Gerät und wird nicht hochgeladen. Unterstützt werden Formate, die dein Browser abspielen kann (meist MP4/WebM).</p><div class="v11-panel"><label class="v11-upload">📁 Video auswählen <input type="file" accept="video/mp4,video/webm,video/*" onchange="openLocalVideo(this.files[0])"></label><div id="v11Player">${localVideoURL?'<video controls playsinline style="width:100%;border-radius:14px;max-height:65vh" src="'+localVideoURL+'"></video>':'<div class="v11-video-placeholder">▶ Dein Video erscheint hier</div>'}</div><p class="muted">Für eigene synchronisierte Untertitel kannst du eine WebVTT-Datei hinzufügen.</p><label class="v11-upload">📝 Untertitel (.vtt) auswählen <input type="file" accept=".vtt,text/vtt" onchange="addLocalCaptions(this.files[0])"></label><p id="captionStatus" class="muted">Untertitel werden nur für die aktuelle Sitzung geladen.</p></div><div class="v11-panel"><h2>Wörter aus dem Video üben</h2><p>Nach dem Anschauen kannst du ein Hörquiz starten oder Wörter aus deiner aktuellen Lernstufe wiederholen.</p><button class="btn" onclick="newGame('listening')">Hörquiz starten</button><button class="btn secondary" onclick="go('feed')">Vokabel-Reels</button></div>`}

function insights(){let a=attempts(),total=a.length,ok=a.filter(x=>x.ok).length;let knownBy=levels.map(l=>({l,n:all.filter(w=>w.level===l&&known()[w.id]).length,t:all.filter(w=>w.level===l).length}));let dates=[...Array(14)].map((_,i)=>{let d=new Date();d.setDate(d.getDate()-13+i);let key=d.toLocaleDateString('sv-SE');return {date:key,count:a.filter(x=>x.date===key).length}});return `<h1>📈 Lernanalyse</h1><p class="muted">Aus deinen lokal gespeicherten Quizantworten und markierten Wörtern. Keine externen Daten.</p><div class="quick-stats"><div><b>${total}</b><span>Antworten</span></div><div><b>${total?Math.round(ok/total*100):0}%</b><span>Richtig</span></div><div><b>${state.v12Stars||0}</b><span>Story-Sterne</span></div></div><h2>Wortschatz nach Stufe</h2><div class="v12-analytics">${knownBy.map(x=>`<div><div class="v12-row"><b>${x.l}</b><small>${x.n} / ${x.t}</small></div><div class="bar"><div style="width:${x.t?x.n/x.t*100:0}%"></div></div></div>`).join('')}</div><h2>Letzte 14 Tage</h2><div class="v12-heatmap">${dates.map(d=>`<span title="${d.date}: ${d.count} Antworten" style="opacity:${Math.max(.18,Math.min(1,d.count/8))}"></span>`).join('')}</div><p class="muted">${total?'Trainiere besonders die Stufen mit wenigen gelernten Wörtern.':'Beantworte zuerst ein Quiz, damit eine persönliche Auswertung entsteht.'}</p><button class="btn primary" onclick="go('review')">Schwierige Wörter wiederholen →</button>`}

function boss(){if(!v12Exam)return `<h1>🏆 Boss-Level</h1><p class="muted">10 zufällige Fragen aus deiner Stufe. Übungsprüfung, kein offizielles Zertifikat.</p>${levelTabs()}<div class="v12-hero"><h2>Die große ${state.level}-Challenge</h2><p>Erreiche mindestens 8 von 10 Punkten und verdiene dein Übungsabzeichen.</p><button class="btn primary" onclick="v12StartBoss()">Prüfung starten →</button></div><p>Freigeschaltete Übungsabzeichen: ${(state.v12BossBadges||[]).join(', ')||'Noch keine'}</p>`;let e=v12Exam;if(e.index>=e.questions.length)return `<h1>🏆 Ergebnis</h1><div class="v12-hero"><h2>${e.score} / ${e.questions.length} richtig</h2><p>${e.score>=8?'✓ Boss-Level bestanden!':'Noch nicht bestanden. Übe und versuche es erneut.'}</p><button class="btn primary" onclick="v12Exam=null;render()">Zur Übersicht</button></div>`;let q=e.questions[e.index];return `<div class="eyebrow">BOSS-LEVEL · ${e.level} · ${e.index+1}/${e.questions.length}</div><h1>Wie heißt das auf Koreanisch?</h1><div class="v12-scene"><h2>${esc(q.item.de)}</h2><button class="btn secondary" onclick="speak(${JSON.stringify(q.item.ko).replace(/"/g,'&quot;')})">♫ Anhören</button></div><div class="v12-answers">${q.options.map((w,i)=>`<button class="v12-answer ${e.picked===i?(w.id===q.item.id?'correct':'wrong'):''}" ${e.picked!==undefined?'disabled':''} onclick="v12BossAnswer(${i})"><strong>${esc(w.ko)}</strong>${e.picked!==undefined?`<small class="quiz-translation">${esc(w.de)}</small>`:''}</button>`).join('')}</div>${e.picked!==undefined?`<div class="v12-result">${q.options[e.picked].id===q.item.id?'✓ Richtig!':'Nicht ganz. Richtige Antwort: '+esc(q.item.ko)}</div><button class="btn primary" onclick="v12BossNext()">Nächste Frage →</button>`:''}`}
function v12StartBoss(){let pool=all.filter(w=>w.level===state.level);if(pool.length<4)return;let items=shuffle(pool).slice(0,10);v12Exam={level:state.level,index:0,score:0,questions:items.map(item=>({item,options:shuffle([item,...shuffle(pool.filter(w=>w.de!==item.de)).slice(0,3)])}))};render()}
function v12BossAnswer(i){let e=v12Exam;if(!e||e.index>=e.questions.length)return;let q=e.questions[e.index],ok=q.options[i].id===q.item.id;if(e.picked!==undefined)return;e.picked=i;if(ok)e.score++;scheduleReview(q.item.id,ok);state.attempts=[...attempts(),{date:day(),ok,level:e.level}];if(e.index===e.questions.length-1&&e.score>=8){if(!(state.v12BossBadges||[]).includes(e.level)){state.v12BossBadges=[...(state.v12BossBadges||[]),e.level];gainXP(100,'Boss-Level bestanden')}}persist();render()}

let wjHistory=(()=>{try{const a=JSON.parse(localStorage.getItem('woo_jin_chat_v1')||'null');return Array.isArray(a)?a.slice(-40):wjInitial()}catch{return wjInitial()}})();
let wjBusy=false;
let wjScene='cafe';
function wjSave(){try{localStorage.setItem('woo_jin_chat_v1',JSON.stringify(wjHistory.slice(-40)))}catch{}}
function wjReplyLocal(message){
 const t=message.toLowerCase().trim(),sc=wjScenes.find(x=>x[0]===wjScene)||wjScenes[0];
 if(/^(hallo|hi|hey|annyeong|guten tag)/i.test(t))return {ko:'Annyeong! Mannaseo bangawoyo.',de:'Hallo! Schön, dich kennenzulernen. Was möchtest du heute üben?'};
 if(/danke|gamsa|gomawo/.test(t))return {ko:'Cheonmaneyo! Gachi gongbuhaeyo.',de:'Gern geschehen! Lass uns zusammen lernen.'};
 if(/wie geht|jal jinae|geht es/.test(t))return {ko:'Ne, jal jinaeyo! Dangsin-eun eottaeyo?',de:'Ja, mir geht es gut! Und wie geht es dir?'};
 if(/übersetz|bedeut|heißt|wort|vokabel/.test(t)){
  const q=t.replace(/^(wie heißt|was bedeutet|übersetze|übersetzen|das wort|vokabel)\s*/,'').replace(/[?!.]/g,'').trim();
  const found=all.find(w=>w.de.toLowerCase()===q||w.ko.toLowerCase()===q)||all.find(w=>q.length>3&&(w.de.toLowerCase().includes(q)||w.ko.toLowerCase().includes(q)));
  if(found)return {ko:found.ko,de:`${found.de} (${found.level}). Tippe auf ♫, um die Aussprache anzuhören.`};
  return {ko:'Dasi malhae juseyo.',de:'Dafür habe ich lokal keinen sicheren Wörterbucheintrag gefunden. Probiere ein kürzeres Wort oder suche im Wörterbuch.'};
 }
 if(/grammatik|partikel|satzbau/.test(t))return {ko:'Jeoneun hangug-eoreul gongbuhaeyo.',de:'Beispiel: „Ich lerne Koreanisch.“ Im Koreanischen steht das Verb normalerweise am Satzende. Im Grammatik-Atlas findest du weitere Regeln.'};
 if(/quiz|frage|test/.test(t))return {ko:sc[2],de:'Mini-Rollenspiel: '+sc[3]+' Wähle eine der vorgeschlagenen Antworten oder schreibe selbst.'};
 if(/lernen|üben|training/.test(t))return {ko:'Gachi yeonseuphaeyo!',de:'Sehr gern! Wähle oben ein Szenario. Ich stelle dir dazu eine passende Frage.'};
 if(/amerika|amerikano|keopi|kaffee/.test(t))return {ko:'Ne, amerikano hana deurilgeyo.',de:'Ja, einen Americano bekommen Sie. Gut gemacht! Möchtest du noch etwas bestellen?'};
 if(/mul|wasser/.test(t))return {ko:'Ne, mul juseyo!',de:'„Mul juseyo“ bedeutet „Wasser bitte“. Sehr gut!'};
 if(/seoul|gayo|bahnhof|jihacheol/.test(t))return {ko:'Seoul-e ganeungunyo! Joheun yeohaeng doeseyo.',de:'Du fährst also nach Seoul! Gute Reise. Du kannst nach dem Weg fragen: „Jihacheol yeok-i eodiyeyo?“'};
 const match=all.find(w=>t.length>3&&(t.includes(w.ko.toLowerCase())||t.includes(w.de.toLowerCase())));
 if(match)return {ko:match.ko,de:`Das bedeutet „${match.de}“. Kannst du damit einen eigenen Satz bilden?`};
 return {ko:sc[2],de:'Ich bin die lokale Version von Woo Jin und kann freie Sätze noch nicht zuverlässig verstehen. '+sc[3]+' Nutze die Antwortvorschläge oder verbinde später einen KI-Server.'};
}
function wjAdd(who,ko,de){wjHistory.push({who,ko,de});wjHistory=wjHistory.slice(-40);wjSave()}
async function wjSend(value){
 const text=(value||document.getElementById('wjInput')?.value||'').trim();if(!text||wjBusy)return;
 wjAdd('me',text,'');wjBusy=true;render();
 try{
  let answer;
  if(state.wjOnline){
   const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),45000);
   try{
    const response=await fetch('/api/woo-jin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,level:state.level,scene:wjScene,history:wjHistory.slice(-12),mood:wjMoodName}),signal:controller.signal});
    if(!response.ok){const problem=await response.json().catch(()=>({}));throw Error(problem.error||'Server nicht erreichbar')};
    const obj=await response.json();
    if(typeof obj.ko!=='string'||typeof obj.de!=='string')throw Error('Ungültige Serverantwort');
    answer={ko:obj.ko.slice(0,1200),de:obj.de.slice(0,1600)};
   }finally{clearTimeout(timer)}
  }else answer=wjReplyLocal(text);
  wjAdd('bot',answer.ko,answer.de)
 }catch(e){wjAdd('bot','Jamsi manyo.','KI-Verbindung fehlgeschlagen: '+String(e.message||e).slice(0,160)+'. Starte den Server oder nutze den Offline-Modus.')}
 finally{wjBusy=false;if(state.page==='wooJin'){render();const chat=document.getElementById('wjChat');if(chat)chat.scrollTop=chat.scrollHeight}}
}
let wjMoodName='calm';function wjMood(mood){wjMoodName=mood;wjAdd('bot',mood==='coach'?'Oneuldo himnaeyo!':mood==='friendly'?'Keopi han jan halkkayo?':'Cheoncheonhi haedo dwaeyo.',mood==='coach'?'Los, wir schaffen das Training!':mood==='friendly'?'Lass uns entspannt üben.':'Du kannst in deinem Tempo lernen.');render()}
function wjScenePick(id){wjScene=id;const sc=wjScenes.find(x=>x[0]===id);wjAdd('bot',sc[2],sc[3]);render()}
function wjClear(){if(!confirm('Woo-Jin-Chatverlauf löschen?'))return;wjHistory=wjInitial();wjSave();render()}
function wooJin(){
 const sc=wjScenes.find(x=>x[0]===wjScene)||wjScenes[0];
 return `<section class="wj-page">
 <div class="wj-profile"><div class="wj-portrait"><img src="woo-jin-portrait.webp" alt="Woo Jin Porträt"><span class="wj-online-dot"></span></div><div><div class="wj-name">Woo Jin <span>✦</span></div><p>Dein koreanischer Lernbegleiter · ${state.wjOnline?'Echte KI (Server erforderlich)':'Offline-Dialoge'}</p></div><button class="wj-reset" onclick="wjClear()" title="Chat leeren">↺</button></div>
 <div class="wj-character-stage"><div class="wj-stage-portrait"><img src="woo-jin-portrait.webp" alt="Woo Jin in dunkler Jacke, Manhwa-Charakter"></div><div class="wj-stage-copy"><span class="wj-stage-eyebrow">DEIN KOREANISCH-COACH · SEOUL</span><strong>Annyeong. Bereit?</strong><span>Wir trainieren zusammen. Ohne Druck.</span><div class="wj-stage-moods"><button onclick="wjMood('calm')">🌙 Ruhig</button><button onclick="wjMood('coach')">🥊 Coach</button><button onclick="wjMood('friendly')">☕ Locker</button></div></div></div><div id="wjStatus" class="wj-status"></div><div class="wj-disclaimer">${state.wjOnline?'Woo Jin spricht über die OpenAI-API, sobald der Server gestartet und ein API-Schlüssel eingerichtet ist.':'Aktuell Offline-Modus mit vorbereiteten Antworten. Für echte freie KI-Gespräche unten KI-Modus aktivieren und den beiliegenden Server starten.'}</div>
 <div class="wj-scene-tabs">${wjScenes.map(x=>`<button class="${wjScene===x[0]?'active':''}" onclick="wjScenePick('${x[0]}')">${x[1]}</button>`).join('')}</div>
 <div class="v15-scene-hero" style="min-height:120px;margin:12px 0"><img alt="Dein aktuelles Alltagsszenario" src="https://images.unsplash.com/${({cafe:"photo-1445116572660-236099ec97a0",reise:"photo-1544620347-c4fd4a3d5957",freunde:"photo-1529156069898-49953e39b3ac",arbeit:"photo-1521737711867-e3b97375f902"})[wjScene]||"photo-1445116572660-236099ec97a0"}?auto=format&amp;fit=crop&amp;w=900&amp;q=75"><div><strong>${esc(sc[1])}</strong><p>Dein Gespräch in einer realistischen Situation.</p></div></div><div class="wj-chat" id="wjChat">${wjHistory.map(m=>`<div class="wj-message ${m.who==='me'?'mine':'theirs'}">${m.who==='bot'?'<span class="wj-avatar-mini"><img src="woo-jin-portrait.webp" alt=""></span>':''}<div class="wj-bubble"><div class="wj-korean">${esc(m.ko)}</div>${m.de?`<div class="wj-de">${esc(m.de)}</div>`:''}${m.who==='bot'?`<button class="wj-audio" onclick="speak(${JSON.stringify(m.ko).replace(/"/g,'&quot;')})">♫ Anhören</button>`:''}</div></div>`).join('')}${wjBusy?'<p class="wj-typing">Woo Jin schreibt …</p>':''}</div>
 <div class="wj-suggestions">${sc[4].map(x=>`<button onclick="wjSend(${JSON.stringify(x).replace(/"/g,'&quot;')})">${esc(x)}</button>`).join('')}</div>
 <form class="wj-compose" onsubmit="event.preventDefault();wjSend()"><input id="wjInput" placeholder="Nachricht an Woo Jin …" autocomplete="off" maxlength="500" aria-label="Nachricht an Woo Jin"><button type="submit" ${wjBusy?'disabled':''} aria-label="Senden">➤</button></form>
 <details class="wj-details"><summary>KI-Verbindung & Datenschutz</summary><p>Für freie Gespräche mit einem echten Sprachmodell ist ein eigener sicherer Server erforderlich. Er muss POST /api/woo-jin annehmen und JSON mit den Feldern <code>ko</code> (Koreanisch in Umschrift) und <code>de</code> (deutsche Erklärung) zurückgeben. API-Schlüssel gehören ausschließlich auf den Server, niemals in diese HTML-App. Im lokalen Modus werden Nachrichten nur in diesem Browser gespeichert.</p><label><input type="checkbox" ${state.wjOnline?'checked':''} onchange="state.wjOnline=this.checked;persist();render();wjCheckServer()"> Echte KI über den beiliegenden Server verwenden</label><button type="button" class="wj-check" onclick="wjCheckServer()">Verbindung prüfen</button></details>
 </section>`
}

async function wjCheckServer(){const n=document.getElementById('wjStatus');if(!n)return;n.textContent='Verbindung wird geprüft …';try{const r=await fetch('/api/status',{cache:'no-store'});const x=await r.json();n.textContent=x.ready?'● KI-Server bereit · OpenAI-Schlüssel vorhanden':'○ Server läuft, aber OPENAI_API_KEY fehlt'}catch{n.textContent='○ Kein KI-Server verbunden · Offline-Modus verfügbar'}}
function render(){nav();socialTop();el.innerHTML=({home,courses,lesson,cards,quiz,numbers,progress,rewards,clips,feed,media,roleplay,handbook,dictionary,coach,review,path,challenge,games,dailyPlan,localMedia,onlineFeatures,city,story,messenger,karaoke,avatarShop,insights,boss,wooJin}[state.page]||home)();if(state.page==='feed')setupFeed();if(state.page==='wooJin')wjCheckServer();}render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
