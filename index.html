function scheduleReview(id,correct){if(!id)return;const records=state.srs||{};const old=records[id]||{box:0};const box=correct?Math.min(5,(old.box||0)+1):0;const intervals=[0,1,3,7,14,30];const date=new Date();date.setDate(date.getDate()+intervals[box]);state.srs={...records,[id]:{box,due:date.toLocaleDateString('sv-SE'),last:day()}}}
function dueWords(){return all.filter(w=>{const r=(state.srs||{})[w.id];return r&&r.due<=day()}).sort((a,b)=>(state.srs[a.id].box||0)-(state.srs[b.id].box||0))}
function review(){const due=dueWords();const idx=Math.min(state.reviewIndex||0,Math.max(0,due.length-1));const w=due[idx];return `<div class="eyebrow">SMART REVIEW</div><h1>Wiederholen ↻</h1><p class="muted">Wörter erscheinen erneut, wenn ihre Wiederholung fällig ist. Nach einem Fehler kommen sie früher zurück.</p><div class="review-count"><b>${due.length}</b><span>heute fällige Wörter</span></div>${w?`<div class="review-card"><small>${w.level} · ${idx+1}/${due.length}</small><h2>${esc(w.ko)}</h2><p ${state.reviewReveal?`data-native-src="${esc(w.de)}" translate="no"`:""}>${state.reviewReveal?esc(wjNativeMeaning(w.de)):'Übersetzung noch verdeckt'}</p><button class="btn secondary" onclick="speak(${JSON.stringify(w.ko).replace(/"/g,'&quot;')})">♫ Anhören</button></div><div class="actions">${!state.reviewReveal?`<button class="btn" onclick="state.reviewReveal=true;render()">Übersetzung zeigen</button>`:`<button class="btn secondary" onclick="reviewRate('${w.id}',false)">Noch nicht gewusst</button><button class="btn" onclick="reviewRate('${w.id}',true)">Gewusst +5 XP</button>`}</div>`:`<div class="review-card"><h2>Alles geschafft! ✦</h2><p>Heute ist nichts mehr fällig. Du kannst trotzdem weitere Vokabeln lernen.</p><button class="btn" onclick="go('feed')">Neue Vokabeln entdecken</button></div>`}<div class="actions"><button class="btn secondary" onclick="startQuiz('all')">Tagesquiz starten</button></div>`}
function reviewRate(id,ok){scheduleReview(id,ok);if(ok)gainXP(5,'Wiederholung');state.reviewReveal=false;state.reviewIndex=0;persist();render()}
function path(){const lv=state.level;const list=lessons.filter(l=>l.level===lv);return `<div class="eyebrow">DEIN KURS</div><h1>Dein Lernpfad ◇</h1><p class="muted">Lerne ein Thema nach dem anderen. Zu jeder Lektion gibt es Wörter, Aussprache und ein Quiz.</p>${levelTabs()}<div class="path-list">${list.map((l,i)=>{const n=l.words.filter((w,j)=>known()[l.id+':'+j]).length;const pct=Math.round(n/l.words.length*100);return `<button class="path-node" onclick="openLesson('${l.id}')"><span class="path-step">${i+1}</span><span class="path-body"><b>${l.icon} ${esc(l.name)}</b><small>${n}/${l.words.length} Wörter gelernt · ${pct}%</small><span class="path-meter"><i style="width:${pct}%"></i></span></span><span class="path-arrow">›</span></button>`}).join('')}</div><p class="muted">Der Lernpfad bietet strukturierte Übungen. Eine Einstufung oder Zertifizierung wird nicht automatisch vergeben.</p>`}
const speakingScenes=[
{level:'A1',name:'Im Café',intro:'Annyeonghaseyo! Mwo deurilkkayo?',de:'Guten Tag! Was darf es sein?',sample:'Keopi han jan juseyo.',translation:'Einen Kaffee bitte.',keys:['keopi','juseyo']},

function coach(){const i=state.coachIndex||0,scene=speakingScenes[i];return `<div class="eyebrow">SPEAKING STUDIO</div><h1>Sprich Koreanisch ◉</h1><p class="muted">Übe Dialoge, höre eine Beispielantwort und nimm deine Stimme auf. Mit der Selbstkontrolle kannst du deine Aussprache vergleichen.</p><div class="media-tabs">${speakingScenes.map((x,j)=>`<button class="${j===i?'active':''}" onclick="state.coachIndex=${j};state.coachFeedback='';persist();render()">${x.level} · ${x.name}</button>`).join('')}</div><div class="coach-stage"><span class="eyebrow">DEIN GESPRÄCHSPARTNER · ${scene.level}</span><div class="coach-avatar">◉</div><h2>${esc(scene.intro)}</h2><p>${esc(scene.de)}</p><button class="btn secondary" onclick="speak(${JSON.stringify(scene.intro).replace(/"/g,'&quot;')})">♫ Frage anhören</button></div><div class="coach-answer"><small>DEINE ANTWORT · BEISPIEL</small><h3>${esc(scene.sample)}</h3><p>${esc(scene.translation)}</p><div class="actions"><button class="btn secondary" onclick="speak(${JSON.stringify(scene.sample).replace(/"/g,'&quot;')})">♫ Beispiel anhören</button><button class="btn" id="recordBtn" onclick="toggleRecording()">● Eigene Stimme aufnehmen</button></div><div id="recordStatus" class="record-status">Für die Aufnahme benötigt dein Browser Mikrofonzugriff und eine sichere HTTPS-Verbindung.</div><div id="recordPlayback"></div></div><div class="coach-answer"><small>ANTWORT IN LATEINISCHER UMSCHRIFT</small><textarea id="coachText" rows="3" placeholder="Schreibe deine Antwort, z. B. ${esc(scene.sample)}"></textarea><div class="actions"><button class="btn" onclick="checkCoachText()">Antwort prüfen</button><button class="btn secondary" onclick="document.getElementById('coachText').value=${JSON.stringify(scene.sample).replace(/"/g,'&quot;')}">Beispiel einsetzen</button></div><div id="coachFeedback" class="record-status">Die Textprüfung erkennt passende Schlüsselwörter. Sie ist keine KI und bewertet weder Grammatik noch Aussprache zuverlässig.</div></div>`}
function checkCoachText(){const scene=speakingScenes[state.coachIndex||0];const v=(document.getElementById('coachText').value||'').toLowerCase().replace(/[^a-z ]/g,' ');const found=scene.keys.filter(k=>v.includes(k));const target=document.getElementById('coachFeedback');if(!v.trim()){target.textContent='Schreibe zuerst eine Antwort.';return}target.textContent=found.length===scene.keys.length?'✓ Passende Schlüsselwörter gefunden! Vergleiche jetzt mit der Beispielantwort.':'Du hast '+found.length+' von '+scene.keys.length+' Schlüsselwörtern getroffen. Versuche es noch einmal oder nutze die Beispielantwort.';if(found.length===scene.keys.length){gainXP(8,'Sprechübung');persist()}}
async function toggleRecording(){const b=document.getElementById('recordBtn'),status=document.getElementById('recordStatus');if(voiceRecorder&&voiceRecorder.state==='recording'){voiceRecorder.stop();b.textContent='● Erneut aufnehmen';status.textContent='Aufnahme beendet. Du kannst sie gleich anhören.';return}if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){status.textContent='Dein Browser unterstützt die Aufnahme hier nicht. Öffne die App über HTTPS in einem aktuellen Browser.';return}try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});voiceChunks=[];voiceRecorder=new MediaRecorder(stream);voiceRecorder.ondataavailable=e=>{if(e.data.size)voiceChunks.push(e.data)};voiceRecorder.onstop=()=>{if(voiceUrl)URL.revokeObjectURL(voiceUrl);voiceUrl=URL.createObjectURL(new Blob(voiceChunks,{type:voiceRecorder.mimeType||'audio/webm'}));const p=document.getElementById('recordPlayback');if(p)p.innerHTML='<audio controls src="'+voiceUrl+'"></audio><p class="muted">Die Aufnahme bleibt nur in dieser Sitzung und wird nicht hochgeladen.</p>';stream.getTracks().forEach(t=>t.stop())};voiceRecorder.start();b.textContent='■ Aufnahme stoppen';status.textContent='Aufnahme läuft … sprich deine Antwort laut.'}catch(e){status.textContent='Mikrofon nicht verfügbar oder Berechtigung abgelehnt.'}}
function challenge(){const a=attempts(),now=new Date(),start=new Date(now);start.setDate(now.getDate()-6);const recent=a.filter(x=>new Date(x.date)>=start);const knownCount=Object.values(known()).filter(Boolean).length;const quests=[['Tagesquiz',Math.min(todayCount(),10),10,'10 Quizantworten heute'],['Wochenfokus',Math.min(recent.length,50),50,'50 Quizantworten in 7 Tagen'],['Wortschatz',Math.min(knownCount,100),100,'100 Wörter als gelernt markieren'],['Level-Jäger',Math.min(xp(),500),500,'500 XP sammeln'],['Dranbleiben',Math.min(streak(),7),7,'7 Tage hintereinander üben']];return `<div class="eyebrow">DEINE CHALLENGES</div><h1>Missionen & Belohnungen ★</h1><p class="muted">Alle Aufgaben basieren auf deinen lokal gespeicherten Lernergebnissen. Keine erfundenen Online-Ranglisten.</p>${rewardSummary()}<div class="challenge-grid">${quests.map(([name,value,max,desc])=>`<div class="challenge-item"><div class="challenge-top"><b>${name}</b><span>${value}/${max}</span></div><p>${desc}</p><div class="path-meter"><i style="width:${value/max*100}%"></i></div><small>${value>=max?'🏆 Geschafft':'✦ Weiterlernen'}</small></div>`).join('')}</div><button class="btn" onclick="startQuiz('all')">Jetzt XP sammeln →</button>`}

let gameRuntime={};
function gamePool(){let pool=all.filter(w=>w.level===state.level);return pool.length>=8?pool:all}
function newGame(kind){let pool=gamePool();gameRuntime={kind,score:0,round:0,done:false,feedback:'',selected:[],pool:shuffle(pool).slice(0,10)};prepareRound();go('games')}
function prepareRound(){let g=gameRuntime;if(g.round>=5){g.done=true;persist();return}g.feedback='';g.selected=[];if(g.kind==='match'){let words=shuffle(g.pool).slice(0,4);g.pairs=words;g.left=shuffle(words);g.right=shuffle(words);g.matched=[];g.first=null}else if(g.kind==='order'){let b=sentenceBank.filter(x=>x[0]===state.level);g.sentence=shuffle(b.length?b:sentenceBank)[0];g.parts=g.sentence[1].split(' ');g.remaining=shuffle(g.parts.map((word,i)=>({word,i})));g.placed=[]}else{g.word=shuffle(g.pool)[0];g.options=shuffle([g.word,...shuffle(poolDifferent(g.word)).slice(0,3)]);g.answer=null}}
function poolDifferent(w){return all.filter(x=>x.de!==w.de&&x.id!==w.id)}
function gamePick(side,index){let g=gameRuntime;if(g.feedback)return;if(!g.first){g.first={side,index};render();return}if(g.first.side===side){g.first={side,index};render();return}let l=side==='left'?g.left[index]:g.left[g.first.index],r=side==='right'?g.right[index]:g.right[g.first.index];if(l.id===r.id){g.matched.push(l.id);g.score+=5;gainXP(5,'Memory-Paar');g.first=null;if(g.matched.length===g.pairs.length)g.feedback='Alle Paare gefunden!'}else{g.feedback='Noch nicht ganz. Versuche es erneut.';g.first=null}render()}
function gameOrderPick(i){let g=gameRuntime;if(g.feedback)return;g.placed.push(g.remaining.splice(i,1)[0]);render()}
function gameOrderUndo(){let g=gameRuntime;if(!g.placed.length)return;g.remaining.push(g.placed.pop());render()}
function gameOrderCheck(){let g=gameRuntime;let ok=g.placed.map(x=>x.i).join(',')===g.parts.map((_,i)=>i).join(',');g.feedback=ok?'Richtig! +15 XP':'Die richtige Reihenfolge: '+g.sentence[1];if(ok){g.score+=15;gainXP(15,'Satzbau')}else gainXP(1,'Satzbau versucht');persist();render()}
function gameAnswer(i){let g=gameRuntime;if(g.answer!==null)return;g.answer=i;let ok=g.options[i].id===g.word.id;g.feedback=ok?'Richtig! +10 XP':'Richtig wäre: '+g.word.ko+' – '+g.word.de;if(ok){g.score+=10;gainXP(10,'Hör-/Lückentraining')}else gainXP(1,'Übung versucht');scheduleReview(g.word.id,ok);persist();render()}
function clearGameFeedback(){gameRuntime.feedback='';render()}
function gameNext(){gameRuntime.round++;prepareRound();render()}
function games(){let g=gameRuntime;if(!g.kind)return `<div class="eyebrow">SPIEL-ARCADE</div><h1>Spielen & lernen 🎮</h1><p class="muted">Vier Übungen mit XP. Deine aktuelle Stufe ist ${state.level}.</p>${levelTabs()}<div class="v11-tiles">${gameKinds.map(x=>`<button class="v11-tile" onclick="newGame('${x[0]}')"><span>${x[1]}</span><b>${x[2]}</b><small>${x[3]}</small></button>`).join('')}</div>`;
let body='';if(g.done)body=`<div class="v11-panel"><h2>🏆 Spiel abgeschlossen</h2><p>${g.score} Punkte in fünf Runden.</p><button class="btn" onclick="newGame('${g.kind}')">Noch einmal</button><button class="btn secondary" onclick="gameRuntime={};render()">Andere Spiele</button></div>`;
else if(g.kind==='match'){body=`<p>Tippe links und rechts auf zusammengehörige Wörter.</p><div class="v11-match"><div>${g.left.map((w,i)=>`<button ${g.matched.includes(w.id)?'disabled':''} class="${g.first?.side==='left'&&g.first.index===i?'chosen':''}" onclick="gamePick('left',${i})">${esc(w.ko)}</button>`).join('')}</div><div>${g.right.map((w,i)=>`<button ${g.matched.includes(w.id)?'disabled':''} class="${g.first?.side==='right'&&g.first.index===i?'chosen':''}" onclick="gamePick('right',${i})">${esc(w.de)}</button>`).join('')}</div></div>${g.feedback?`<div class="notice">${esc(g.feedback)}</div><button class="btn" onclick="${g.matched.length===4?'gameNext()':'clearGameFeedback()'}">${g.matched.length===4?'Weiter':'Erneut versuchen'}</button>`:''}`}
else if(g.kind==='order'){body=`<p>Baue diesen Satz auf: <b>${esc(g.sentence[2])}</b></p><div class="v11-slots">${g.placed.map(x=>`<span>${esc(x.word)}</span>`).join('')||'Tippe unten auf die Wörter'}</div><div class="v11-words">${g.remaining.map((x,i)=>`<button onclick="gameOrderPick(${i})">${esc(x.word)}</button>`).join('')}</div><div class="actions"><button class="btn secondary" onclick="gameOrderUndo()">↶ Zurück</button><button class="btn" ${g.remaining.length?'disabled':''} onclick="gameOrderCheck()">Prüfen</button></div>${g.feedback?`<div class="notice">${esc(g.feedback)}</div><button class="btn" onclick="gameNext()">Weiter</button>`:''}`}
else {let w=g.word;body=`<p>${g.kind==='listening'?'Höre den Ausdruck. Welche Umschrift passt?':'Wähle die passende koreanische Umschrift.'}</p><div class="v11-panel"><h2>${g.kind==='listening'?'🎧 Erst anhören':esc(w.de)}</h2>${g.kind==='listening'?`<button class="btn" onclick="speak(${JSON.stringify(w.ko).replace(/"/g,'&quot;')})">▶ Ausdruck abspielen</button>`:''}</div><div class="v11-answers">${g.options.map((x,i)=>`<button ${g.answer!==null?'disabled':''} onclick="gameAnswer(${i})">${esc(x.ko)}${g.answer!==null?`<small class="quiz-translation">${esc(x.de)}</small>`:''}</button>`).join('')}</div>${g.feedback?`<div class="notice">${esc(g.feedback)}</div><button class="btn" onclick="gameNext()">Weiter</button>`:''}`}
